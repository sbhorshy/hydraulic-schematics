<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 7 280 89"
     width="280" height="89"
     data-component-type="firewall_shutoff_valve"
     data-symbol-version="1.0"
     data-symbol-form="stroke_geometry"
     data-symbol-status="provisional"
     data-symbol-source-ref="已标注/drawing2/Drawing2.dxf 二位二通阀图元提取, 4.0 px per unit measured"
     data-envelope-class="multi">

  <!-- v1.0 组件符号转正(2026-08-30):本文件前版是 Drawing2.dxf 转换的整张回路图
       (电动机+定量泵+二位二通阀+单向阀+主油路),不是组件符号;完整回路图已存档于
       已标注/drawing2/drawing2.svg,本版仅提取其中的防火墙关断活门本体
       ——二位二通阀(常开),按 multi 多联位基准重绘。
       几何依据:回路图按 4.0 px/单位实测;原双方框 200x100(每格 100x100,分隔线
       x=197.33) -> multi 基准 160x80(每格 80x80,分隔线 x=147),落位 (67,15)-(227,95)。
       走向按 catalog 契约由回路图的竖直(in 上/out 下)转为水平(left/right):
       端口旋转映射,工位图元随转 90 度。

       【工位图元:比例 0.8 映射到整数网格】
         左格 = position1(常开通油工位):通路贯穿全格 M67 55 H147;
           流向箭头(尖朝右,与 outlet 出油同向) polygon (127,52) (127,58) (147,55)
         右格 = position2(另一工位):
           通路自格左缘至 0.25 站 M147 55 H167;节流标记 M167 47 V63;
           节流标记 M207 47 V63;通路自 0.75 站至格右缘 M207 55 H227

       【端口】(与 catalog firewall_shutoff_valve 条目双向一致)
         inlet:hydraulic,role=suction,flow=in,anchor=left,位于左边界 (0,55)。
           (catalog role_note:按装在吸油侧取 suction,若实际压力侧须改 pressure)
         outlet:hydraulic,role=suction,flow=out,anchor=right,位于右边界 (280,55)。
         command:electrical,role=signal_in,flow=none,anchor=up,
           常开工位格顶边中部 (107,15) 向上引线至顶边界 (107,7)。

       正常位:本图按常开绘制(左格通油);catalog defect 注明"正常位(常开/常闭)
       须先确认",确认前引用本符号的 L0 文件须在 unknown 登记。
       未确认项:无标准页依据(status=provisional);正常位常开为回路图绘法待工程确认;
       inlet/outlet 的 role(suction/pressure)待目录复核。

       线宽 stroke-width=2 (基准 T);端口坐标为精确几何端点。 -->

  <g id="symbol" fill="none" stroke="#000000" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- 双格包络 (160x80,每格 80x80 基准) -->
    <path id="housing" d="M67 15 H227 V95 H67 Z"/>
    <path id="housing-divider" d="M147 15 V95"/>

    <!-- 左格 position1:常开通油工位 -->
    <path id="position1-passage" d="M67 55 H147"/>
    <polygon id="valve-flow-arrow" points="127,52 127,58 147,55"
             fill="#000000" stroke="none"/>

    <!-- 右格 position2:节流标记工位 -->
    <path id="position2-passage-upper" d="M147 55 H167"/>
    <path id="position2-tick-upper" d="M167 47 V63"/>
    <path id="position2-tick-lower" d="M207 47 V63"/>
    <path id="position2-passage-lower" d="M207 55 H227"/>

    <!-- 电令口引线:常开工位格顶边中部 (107,15) 向上至顶边界 -->
    <line id="command-line" x1="107" y1="15" x2="107" y2="7"/>
  </g>

  <g id="connection-points" fill="#ff0000">
    <circle id="port-inlet" cx="0" cy="55" r="2"
            data-port-id="inlet"
            data-medium="hydraulic"
            data-port-role="suction"
            data-flow-capability="in"
            data-anchor-direction="left"/>
    <circle id="port-outlet" cx="280" cy="55" r="2"
            data-port-id="outlet"
            data-medium="hydraulic"
            data-port-role="suction"
            data-flow-capability="out"
            data-anchor-direction="right"/>
    <circle id="port-command" cx="107" cy="7" r="2"
            data-port-id="command"
            data-medium="electrical"
            data-port-role="signal_in"
            data-flow-capability="none"
            data-anchor-direction="up"/>
  </g>
</svg>
