# L0 系统意图：1# 液压系统（组件清单版）
#
# 唯一输入：`./1#系统组件.json`（工程师手写组件清单，非结构化；自 已标注/1#系统原理图/ 复制回位，归档件为准）。
# 本文件把清单逐项落成受控 parts / taps / unknown：
#   清单 18 项 -> 22 个受控实例（含用户 8 只名框）+ 2 个气侧 taps；
#   用户按 skill 通用用户框规范(hydraulic_user)建模，名单逐项落实例；
#   4 项（能源转换装置选择阀、能源转换装置、集中加油组件、地面加油单向阀）
#   因类型未登记/拓扑未声明不入图，逐条见 unknown 与追溯清单简化说明。
#
# 状态：草案（concept），不可用于工程放行。
# 目录：本工作目录扩展副本 component-catalog.json（0.3-draft，
#       基于 skill 快照新增 8 类型 + 收录 hydraulic_user，见 build_catalog.py）。
# 布局与架构判断沿 system-1.intent.yaml 审查卡结论（FSOV 装吸油侧、
# 双泵并联无隔离单向阀、蓄压器置于压力滤下游等），新增件的安装位置
# 由我判断并在对应行注明。

l0_version: "1.1"
system: HYD-SYS-1
catalog: "comac-hydraulic-components@0.3-draft"
maturity: concept

# 用户不再用边界标记：skill 通用用户框规范(hydraulic_user)生效，
# 8 只用户名框全部入 parts，供压/回油均为真实受控端口。
extern: {}

parts:
  TANK-001: bootstrap_reservoir                          # 清单17 bootstrap-type-reservoir（油箱）
  FSOV-001: firewall_shutoff_valve                       # 清单3 FWSOV（装吸油侧，审查卡 D-1 判断）
  EDP-001: engine_driven_pump                            # 清单1 EDP
  EMP-001: electric_motor_driven_pump                    # 清单2 EMP
  PF-001: filter_line_shutoff_dp                         # 清单5 压力油滤
  CDF-001: filter_line_shutoff_dp_case_drain             # 清单6 壳体回油滤（清单只声明 1 只，双泵合流接入）
  RF-001: filter_line_shutoff_dp_return                  # 清单7 回油滤
  PRV-001: priority_valve                                # 清单9 优先阀（用户供压优先级）
  PRV-002: priority_valve                                # 清单14 自增压优先阀（油箱增压优先级）
  ACC-001: hydro_pneumatic_accumulator                   # 清单15 系统蓄压器
  ACV-001: air_charging_valve                            # 清单16 充气活门（蓄压器充气压力表组件）
  PG-001: pressure_gauge                                 # 清单16 充气压力表（同上组件）
  QDP-001: quick_disconnect_coupling_disconnected        # 清单8 地面压力快卸接头（断开位）
  QDR-001: quick_disconnect_coupling_disconnected_return # 清单4 地面回油快卸接头（断开位）
  USER-001: hydraulic_user                               # 清单18 MF扰流板
  USER-002: hydraulic_user                               # 清单18 襟翼
  USER-003: hydraulic_user                               # 清单18 缝翼
  USER-004: hydraulic_user                               # 清单18 副翼
  USER-005: hydraulic_user                               # 清单18 升降舵
  USER-006: hydraulic_user                               # 清单18 方向舵
  USER-007: hydraulic_user                               # 清单18 反推
  USER-008: hydraulic_user                               # 清单18 正常刹车

# 液压主路。端口 role 决定线型；@名 为竖直母线（布局给定 x）。
paths:
  # 吸油：油箱 -> EMP；油箱 -> FWSOV -> EDP。完整吸油流道至泵吸入口止。
  # EMP 行在前:先占 y=686 走廊与 x=480 竖廊,FSOV/EDP 行随后走 x=290 竖廊,
  # 两泵吸油线零交叉。
  - ["TANK-001.suction_out", "EMP-001.suction"]
  - ["TANK-001.suction_out", "FSOV-001", "EDP-001.suction"]

  # 压力汇合（双泵直接并联，无隔离单向阀，审查卡 D-2 沿用），
  # 经压力油滤进分配母线(@MANIFOLD)。
  - ["EDP-001.pressure_out", "@PRESS"]
  - ["EMP-001.pressure_out", "@PRESS"]
  - ["@PRESS", "PF-001", "@MANIFOLD"]

  # 分配母线：优先阀 -> 用户供压母线(@USR)分赴八只用户；蓄压器液压口；
  # 自增压优先阀 -> 油箱增压口；地面压力快卸接头支路（断开位，地面侧开放）。
  - ["@MANIFOLD", "PRV-001", "@USR"]
  - ["@USR", "USER-001.pressure_in"]
  - ["@USR", "USER-002.pressure_in"]
  - ["@USR", "USER-003.pressure_in"]
  - ["@USR", "USER-004.pressure_in"]
  - ["@USR", "USER-005.pressure_in"]
  - ["@USR", "USER-006.pressure_in"]
  - ["@USR", "USER-007.pressure_in"]
  - ["@USR", "USER-008.pressure_in"]
  - ["@MANIFOLD", "ACC-001.hydraulic_port"]
  - ["@PRESS", "PRV-002", "TANK-001.bootstrap_pressure_in"]
  - ["@MANIFOLD", "QDP-001.inlet"]

  # 主回油：八只用户回油 -> 收集母线(@USERR) -> 回油滤 RF-001 -> @RET；
  # 母线分赴油箱与地面回油快卸接头。回油滤仍串在用户回油汇入回油母线
  # 之前(v2.3 语义不变:先过滤再分配)。
  - ["USER-001.return_out", "@USERR"]
  - ["USER-002.return_out", "@USERR"]
  - ["USER-003.return_out", "@USERR"]
  - ["USER-004.return_out", "@USERR"]
  - ["USER-005.return_out", "@USERR"]
  - ["USER-006.return_out", "@USERR"]
  - ["USER-007.return_out", "@USERR"]
  - ["USER-008.return_out", "@USERR"]
  - ["@USERR", "RF-001", "@RET"]
  - ["@RET", "TANK-001.return_in"]
  - ["@RET", "QDR-001.inlet"]

  # 壳体回油：双泵合流（清单只声明 1 只壳体回油滤）经 @CASE 母线入滤，
  # 出滤直回油箱。
  - ["EDP-001.case_drain", "@CASE"]
  - ["EMP-001.case_drain", "@CASE"]
  - ["@CASE", "CDF-001", "TANK-001.return_in"]

# 气侧/测量支路（预检处方：气侧件不入 paths，走 taps）。
taps:
  - {sensor: "ACV-001.accumulator_gas", at: "ACC-001.gas_port"}   # 充气活门接蓄压器气口
  - {sensor: "PG-001.pressure_sense", at: "ACV-001.charge_port"}  # 压力表接充气活门充气口

unknown:
  # ---- 清单中未入图的 4 项 ----
  - ETP-selector-valve-not-in-catalog      # 能源转换装置选择阀：类型与符号均未登记，未建模
  - ETP-unit-not-in-catalog                # 能源转换装置：判读疑似 PTU，类型与符号均未登记，未建模
  - ground-refuel-assembly-not-in-catalog  # 集中加油组件：类型与符号均未登记，未建模
  - ground-refuel-check-valve-connection-unknown  # 地面加油单向阀：类型受控(check_valve)，但加油口拓扑未声明，不画
  # ---- 符号侧未确认项（门禁 C12 登记）----
  - priority-valve-internal-check-flow-pending   # 优先阀符号内两只单向阀流向 PENDING
  - quick-disconnect-port-semantics-pending      # 快卸接头符号端口语义待工程确认
  - filter-line-shutoff-dp-standard-page-pending # 滤符号无标准页依据（clause-6.1.6 构型）
  - air-charging-valve-port-orientation-assumed  # 左=蓄压器侧/右=充气源为形位判读，未经标准页
  - pressure-gauge-medium-pneumatic-assumed      # 测压介质按"蓄压器充气压力表"用途定为气侧
  - hydraulic-user-symbol-provisional            # 用户名框符号 provisional 无标准页（skill 通用用户框规范），按 concept 披露
  # ---- 架构判断（沿 system-1 审查卡）----
  - FSOV-001-suction-side-placement-assumed      # FWSOV 装吸油侧为判断；若实际在压力侧须改
  - TANK-001-return-port-count-unconfirmed       # 主回油+壳体回油共用一个 return_in 端口
  - system-relief-valve-not-declared             # 清单仍无系统溢流阀
  - pump-isolation-check-valves-not-declared     # 清单仍无泵隔离单向阀
  # ---- 悬空端口去向 ----
  - EDP-001-drive-shaft-destination              # 机械功率输入端悬空
  - EMP-001-elec-power-destination               # 电源端悬空
  - FSOV-001-command-destination                 # 关断命令端悬空
  - QD-open-ends-are-disconnected-position       # 两只快卸接头地面侧开放为断开位语义，悬空红圈是预期
  - accumulator-charge-source-not-declared       # 充气源去向未声明
  # ---- 参数 ----
  - system-pressure-class
  - EDP-001-rated-flow
  - EMP-001-rated-flow
  - ACC-001-precharge-pressure
  - ACC-001-volume
  - PF-001-filtration-rating
  - RF-001-filtration-rating
  - CDF-001-filtration-rating
  - operating-modes
