<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:sym="urn:hydraulic-symbol"
     version="1.1"
     width="140" height="77.7778" viewBox="0 0 140 77.7778"
     preserveAspectRatio="xMidYMid meet"
     data-symbol-name="Priority Valve"
     data-component-type="priority_valve"
     data-symbol-status="draft"
     data-symbol-form="stroke_geometry"
     data-symbol-source-ref="REDRAWN_FROM:已标注/priority-valve-stroke.svg"
     data-mirror-allowed="false"
     data-allowed-rotations="0 90 180 270" data-envelope-class="assembly">
<!-- 2026-09-29 画布重表达 k=1(符号规范化 campaign):按渲染缩放率 k=0.432099 均匀缩放全部几何,viewBox 0 0 324 180 → 0 0 140 77.7778;占位 140×78 不变,图上几何不变,渲染缩放补偿归一。 -->

  <title>Priority Valve — editable stroke geometry (draft)</title>
  <desc>Editable stroke geometry. The two user-confirmed internal check valves use the geometry supplied in check-valve-stroke.svg and are rendered at equal scale. The lower check valve instance is rotated 180 degrees per user instruction. The two lower bypass-passage bends are rounded. The left/right diamond-like marks are user-confirmed junction points on one continuous horizontal main pipeline. Check-valve flow direction remains pending engineer confirmation; other unconfirmed semantics remain draft/unknown.</desc>

  <style>
    .sym-outline {
      fill: none;
      stroke: currentColor;
      stroke-width: calc(1.5 * var(--T));
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .port-anchor {
      fill: none;
      stroke: none;
      pointer-events: none;
    }
  </style>

  <metadata>
    <sym:symbol
      name="Priority Valve"
      status="draft"
      geometry="stroke_geometry"
      source="user_supplied_svg"
      standardPageConfirmed="false"
      mirrorAllowed="false"
      allowedRotations="0,90,180,270"
      baseWidth="324"
      baseHeight="180"
      baseViewBox="0 0 324 180">

      <sym:ports>
        <sym:port id="inlet"
                  x="0" y="27.2222"
                  direction="left"
                  role="pressure"
                  medium="hydraulic"
                  interfaceGeometry="symbol"
                  status="draft" />
        <sym:port id="outlet"
                  x="140" y="27.2222"
                  direction="right"
                  role="pressure"
                  medium="hydraulic"
                  interfaceGeometry="symbol"
                  status="draft" />
      </sym:ports>

      <sym:connections>
        <sym:pipeline id="main-horizontal-pipeline"
                      orientation="horizontal"
                      centerlineY="63"
                      fromPort="inlet"
                      toPort="outlet"
                      topology="single_pipeline_with_inline_check_valve"
                      status="user_confirmed" />
        <sym:junction id="meta-junction-left" x="38.4568" y="27.2222"
                      pipeline="main-horizontal-pipeline"
                      branch="lower-feedback-passage"
                      status="user_confirmed" />
        <sym:junction id="meta-junction-right" x="98.0864" y="27.2222"
                      pipeline="main-horizontal-pipeline"
                      branch="lower-feedback-passage"
                      status="user_confirmed" />
      </sym:connections>

      <sym:rotations>
        <sym:rotation angle="0"   width="140" height="77.7778" viewBox="0 0 140 77.7778">
          <sym:anchor port="inlet"  x="0"   y="27.2222"  direction="left" />
          <sym:anchor port="outlet" x="140" y="27.2222"  direction="right" />
        </sym:rotation>
        <sym:rotation angle="90"  width="77.7778" height="140" viewBox="0 0 77.7778 140">
          <sym:anchor port="inlet"  x="50.5556" y="0"   direction="up" />
          <sym:anchor port="outlet" x="50.5556" y="140" direction="down" />
        </sym:rotation>
        <sym:rotation angle="180" width="140" height="77.7778" viewBox="0 0 140 77.7778">
          <sym:anchor port="inlet"  x="140" y="50.5556" direction="right" />
          <sym:anchor port="outlet" x="0"   y="50.5556" direction="left" />
        </sym:rotation>
        <sym:rotation angle="270" width="77.7778" height="140" viewBox="0 0 77.7778 140">
          <sym:anchor port="inlet"  x="27.2222" y="140" direction="down" />
          <sym:anchor port="outlet" x="27.2222" y="0"   direction="up" />
        </sym:rotation>
      </sym:rotations>

      <sym:components>
        <sym:component id="meta-check-valve-upper"
                       type="check_valve"
                       status="identified"
                       confirmation="user"
                       geometrySource="check-valve-stroke.svg"
                       flowPermitted="PENDING_ENGINEER_CONFIRMATION"
                       standardPageConfirmed="false" />
        <sym:component id="meta-check-valve-lower"
                       type="check_valve"
                       status="identified"
                       confirmation="user"
                       geometrySource="check-valve-stroke.svg"
                       flowPermitted="PENDING_ENGINEER_CONFIRMATION"
                       standardPageConfirmed="false" />
      </sym:components>

      <sym:uncertainties>
        <sym:item id="upper-regulating-mechanism" status="unknown" note="regulating geometry reproduced from source; exact standard semantics not confirmed" />
        <sym:item id="lower-feedback-mechanism" status="unknown" note="surrounding feedback/bypass geometry reproduced from source; exact standard semantics not confirmed" />
        <sym:item id="spring-function" status="unknown" note="spring-like geometry visible in source; functional role not confirmed by standard page" />
      </sym:uncertainties>
    </sym:symbol>
  </metadata>

  <!-- All visible geometry uses the single global outline class. -->
  <g id="visible-symbol" fill="none" stroke="#000000" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Housing -->
    <path id="housing" d="M32.8395 13.8272 H102.8395 V69.5679 H32.8395 Z" />

    <!-- 2026-10-08: external leads are separate line elements, like filter/pump symbols;
         pressure-network width reaches the housing; internal geometry remains outline width. -->
    <!-- Confirmed main hydraulic path: one horizontal pipeline.
         It is geometrically interrupted only where the inline check-valve symbol occupies the path. -->
    <path id="main-pipeline-left"
          d="M32.8395 27.2222 H66.9753"
          data-network-id="main-horizontal-pipeline" />
    <line id="port-lead-inlet" x1="0" y1="27.2222" x2="32.8395" y2="27.2222" data-interface-port="inlet"/>
    <path id="main-pipeline-right"
          d="M98.0864 27.2222 H102.8395"
          data-network-id="main-horizontal-pipeline" />
    <line id="port-lead-outlet" x1="102.8395" y1="27.2222" x2="140" y2="27.2222" data-interface-port="outlet"/>

    <!-- User-confirmed connection/junction point; formerly misread as a diamond-shaped component. -->
    <circle id="junction-left"
            cx="38.4568" cy="27.2222" r="1.2963" fill="#000000"
            data-component-type="junction"
            data-network-id="main-horizontal-pipeline"
            data-status="user_confirmed" />

    <!-- Upper internal regulating geometry -->
    <path id="upper-vertical-stem" d="M50.9877 36.2963 V21.6049" />
    <path id="upper-stem-arrow" d="M48.3951 25.9259 L50.9877 19.4444 L53.5802 25.9259 L48.3951 25.9259" fill="currentColor" />

    <!-- spring-like zig-zag, semantics intentionally unconfirmed -->
    <polyline id="upper-spring-like"
              data-status="unknown"
              points=" 62.2222,31.9753 65.2469,22.037 68.2716,31.9753 71.2963,22.4691 74.321,29.8148" />

    <!-- User-confirmed internal check valve 1.
         Geometry taken from check-valve-stroke.svg, normalized to inherit .sym-outline.
         Uniform scale only; no mirroring. Flow direction remains pending engineer confirmation. -->
    <g id="check-valve-upper"
       data-component-type="check_valve"
       data-status="identified"
       data-confirmation="user"
       data-geometry-source="check-valve-stroke.svg"
       data-flow-permitted="PENDING_ENGINEER_CONFIRMATION"
       data-allow-mirror="false"
       transform="translate(66.9753 11.6667) scale(0.9)">
      <line id="upper-check-line-left" x1="0" y1="17.284" x2="7.7778" y2="17.284" />
      <line id="upper-check-line-right" x1="24.6296" y1="17.284" x2="34.5679" y2="17.284" />
      <circle id="upper-check-ball" cx="15.1235" cy="17.284" r="6.9136" />
      <path id="upper-check-seat" d="M13.8272 4.7531 L24.6296 17.284 L13.8272 29.8148" />
    </g>
    <!-- User-confirmed connection/junction point; formerly misread as a diamond-shaped component. -->
    <circle id="junction-right"
            cx="98.0864" cy="27.2222" r="1.2963" fill="#000000"
            data-component-type="junction"
            data-network-id="main-horizontal-pipeline"
            data-status="user_confirmed" />

    <!-- Lower feedback / bypass passage -->
    <path id="lower-left-passage"
          d="M38.4568 27.2222 V48.8272 Q38.4568 52.284 41.9136 52.284 H52.716"
          data-from-junction="junction-left"
          data-network-id="lower-feedback-passage" />
    <path id="lower-right-passage"
          d="M83.8272 52.284 H94.6296 Q98.0864 52.284 98.0864 48.8272 V27.2222"
          data-to-junction="junction-right"
          data-network-id="lower-feedback-passage" />

    <!-- User-confirmed internal check valve 2.
         Geometry taken from check-valve-stroke.svg, normalized to inherit .sym-outline.
         Uniform scale only; no mirroring. Flow direction remains pending engineer confirmation. -->
    <g id="check-valve-lower"
       data-component-type="check_valve"
       data-status="identified"
       data-confirmation="user"
       data-geometry-source="check-valve-stroke.svg"
       data-flow-permitted="PENDING_ENGINEER_CONFIRMATION"
       data-allow-mirror="false"
       transform="translate(52.716 36.7284) scale(0.9) rotate(180 17.284 17.284)">
      <line id="lower-check-line-left" x1="0" y1="17.284" x2="7.7778" y2="17.284" />
      <line id="lower-check-line-right" x1="24.6296" y1="17.284" x2="34.5679" y2="17.284" />
      <circle id="lower-check-ball" cx="15.1235" cy="17.284" r="6.9136" />
      <path id="lower-check-seat" d="M13.8272 4.7531 L24.6296 17.284 L13.8272 29.8148" />
    </g>

  </g>

  <!-- Invisible machine-readable anchors. -->
  <g id="connection-points" fill="#ff0000">
    <circle id="port-inlet-anchor"
            class="port-anchor"
            cx="0" cy="27.2222" r="0.8642"
            data-port-id="inlet"
            data-medium="hydraulic"
            data-port-role="pressure"
            data-flow-capability="in"
            data-anchor-direction="left" />
    <circle id="port-outlet-anchor"
            class="port-anchor"
            cx="140" cy="27.2222" r="0.8642"
            data-port-id="outlet"
            data-medium="hydraulic"
            data-port-role="pressure"
            data-flow-capability="out"
            data-anchor-direction="right" />
  </g>
</svg>
