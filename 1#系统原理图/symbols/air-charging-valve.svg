<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:sym="urn:hydraulic-symbol"
     version="1.1"
     width="268" height="114" viewBox="0 0 268 114"
     preserveAspectRatio="xMidYMid meet"
     data-status="draft"
     data-component-type="air_charging_valve"
     data-symbol-status="draft"
     data-symbol-form="stroke_geometry"
     data-symbol-source-ref="REDRAWN_FROM:Air-Charging Valve for Accumulator.svg"
     data-mirror-allowed="false"
     data-allowed-rotations="0 90 180 270">

  <title>Editable stroke symbol — draft</title>
  <desc>Reconstructed from the user-supplied filled-outline SVG as editable stroke geometry. Visible component semantics are not confirmed by a standard page and remain draft/unknown. Port anchors are machine-readable. Mirroring is forbidden.</desc>

  <style>
    .sym-outline {
      fill: none;
      stroke: currentColor;
      stroke-width: calc(1.5 * var(--T));
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .port-anchor {
      fill: none;
      stroke: none;
      pointer-events: none;
    }
  </style>

  <metadata>
    <sym:symbol
      status="draft"
      geometry="stroke_geometry"
      source="user_supplied_filled_outline_svg"
      standardPageConfirmed="false"
      mirrorAllowed="false"
      allowedRotations="0,90,180,270"
      baseWidth="268"
      baseHeight="114"
      baseViewBox="0 0 268 114">

      <sym:ports>
        <sym:port id="accumulator_gas"
                  x="0" y="59"
                  direction="left"
                  role="gas"
                  medium="pneumatic"
                  interfaceGeometry="symbol"
                  status="draft" />
        <sym:port id="charge_port"
                  x="268" y="59"
                  direction="right"
                  role="gas"
                  medium="pneumatic"
                  interfaceGeometry="symbol"
                  status="draft" />
      </sym:ports>

      <sym:connections>
        <sym:pipeline id="main-horizontal-interface"
                      orientation="horizontal"
                      centerlineY="59"
                      fromPort="accumulator_gas"
                      toPort="charge_port"
                      status="geometry_reconstructed" />
      </sym:connections>

      <sym:components>
        <sym:component id="meta-left-end-feature" type="unknown" status="draft" standardPageConfirmed="false" />
        <sym:component id="meta-central-left-triangle" type="unknown" status="draft" standardPageConfirmed="false" />
        <sym:component id="meta-central-right-triangle" type="unknown" status="draft" standardPageConfirmed="false" />
        <sym:component id="meta-right-small-triangle" type="unknown" status="draft" standardPageConfirmed="false" />
      </sym:components>

      <sym:rotations>
        <sym:rotation angle="0" width="268" height="114" viewBox="0 0 268 114">
          <sym:anchor port="accumulator_gas" x="0"   y="59" direction="left" />
          <sym:anchor port="charge_port"     x="268" y="59" direction="right" />
        </sym:rotation>
        <sym:rotation angle="90" width="114" height="268" viewBox="0 0 114 268">
          <sym:anchor port="accumulator_gas" x="55" y="0"   direction="up" />
          <sym:anchor port="charge_port"     x="55" y="268" direction="down" />
        </sym:rotation>
        <sym:rotation angle="180" width="268" height="114" viewBox="0 0 268 114">
          <sym:anchor port="accumulator_gas" x="268" y="55" direction="right" />
          <sym:anchor port="charge_port"     x="0"   y="55" direction="left" />
        </sym:rotation>
        <sym:rotation angle="270" width="114" height="268" viewBox="0 0 114 268">
          <sym:anchor port="accumulator_gas" x="59" y="268" direction="down" />
          <sym:anchor port="charge_port"     x="59" y="0"   direction="up" />
        </sym:rotation>
      </sym:rotations>

      <sym:uncertainties>
        <sym:item id="component-identity" status="unknown" note="No standard page supplied; geometry reproduced without asserting component identity." />
        <sym:item id="port-media-role" status="unknown" note="Original SVG metadata contains inconsistent port type/direction information; normalized outward anchor directions are used while source values are retained above." />
      </sym:uncertainties>
    </sym:symbol>
  </metadata>

  <g id="visible-symbol" fill="none" stroke="#000000" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Left interface and vertical end feature -->
    <path id="left-end-feature"
          data-component-type="unknown"
          data-status="draft"
          d="M25 39 V79" />
    <path id="left-interface-line"
          data-network-id="main-horizontal-interface"
          data-interface-port="accumulator_gas"
          d="M0 59 H75" />

    <!-- Central opposed triangular geometry; stroke-only, no filled outline tracing -->
    <path id="central-left-triangle"
          data-component-type="unknown"
          data-status="draft"
          d="M75 29 V87 L119 59 Z" />
    <path id="central-right-triangle"
          data-component-type="unknown"
          data-status="draft"
          d="M161 30 V86 L119 59 Z" />

    <!-- Horizontal interface between central and right-side feature -->
    <path id="middle-interface-line"
          data-network-id="main-horizontal-interface"
          d="M161 59 H194" />

    <!-- Right-side smaller triangular geometry -->
    <path id="right-small-triangle"
          data-component-type="unknown"
          data-status="draft"
          d="M194 44 V75 L220 59 Z" />

    <!-- Right interface to machine-readable anchor -->
    <path id="right-interface-line"
          data-network-id="main-horizontal-interface"
          data-interface-port="charge_port"
          d="M220 59 H268" />
  </g>

  <!-- Invisible machine-readable connection anchors. -->
  <g id="connection-points" fill="#ff0000">
    <circle id="port-accumulator-gas-anchor"
            class="port-anchor"
            cx="0" cy="59" r="2"
            data-port-id="accumulator_gas"
            data-medium="pneumatic"
            data-port-role="gas"
            data-flow-capability="bidirectional"
            data-anchor-direction="left" />
    <circle id="port-charge-anchor"
            class="port-anchor"
            cx="268" cy="59" r="2"
            data-port-id="charge_port"
            data-medium="pneumatic"
            data-port-role="gas"
            data-flow-capability="bidirectional"
            data-anchor-direction="right" />
  </g>
</svg>
