<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"
     width="80" height="80"
     data-component-type="firewall_shutoff_valve"
     data-symbol-version="0.1"
     data-symbol-form="stroke_geometry"
     data-symbol-status="provisional"
     data-symbol-source-ref="NONE_NO_STANDARD_PAGE_SUPPLIED">

  <!-- 临时符号。组件库无 FWSOV 资产。
       库内有 Solenoid Valve, Normally Closed, Spring Return.svg,
       但 FWSOV 是否为电磁操纵、是否弹簧复位、常开还是常闭,系统均未声明,
       故不套用该资产。

       本符号只画两位两通换向阀方框 + 电控符号,不标常开/常闭:
       两个方位格内的通断表达需要知道失电位,而失电位未知。
       *** 这是本符号最大的缺陷 ***
       见 unknown: FSOV-001.fail_position。不得用于正式出图。 -->

  <g id="symbol" fill="none" stroke="#000000" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- 两位阀:两个方格 -->
    <rect x="18" y="26" width="22" height="28"/>
    <rect x="40" y="26" width="22" height="28"/>
    <!-- 左格通路(当前示位):直通 -->
    <line x1="18" y1="40" x2="40" y2="40"/>
    <!-- 右格:断路,画两个封堵 T -->
    <line x1="46" y1="40" x2="52" y2="40"/>
    <line x1="52" y1="34" x2="52" y2="46"/>
    <!-- 电控方框(左端) -->
    <rect x="4" y="30" width="14" height="20"/>
    <line x1="4" y1="50" x2="18" y2="30"/>
    <!-- 端口引线 -->
    <line x1="0"  y1="40" x2="4"  y2="40"/>
    <line x1="62" y1="40" x2="80" y2="40"/>
    <line x1="40" y1="26" x2="40" y2="8"/>
  </g>

  <g id="connection-points" fill="#ff0000">
    <circle id="port-inlet" cx="0" cy="40" r="2"
            data-port-id="inlet" data-medium="hydraulic"
            data-port-role="suction" data-flow-capability="in"
            data-anchor-direction="left"/>
    <circle id="port-outlet" cx="80" cy="40" r="2"
            data-port-id="outlet" data-medium="hydraulic"
            data-port-role="suction" data-flow-capability="out"
            data-anchor-direction="right"/>
    <circle id="port-command" cx="40" cy="0" r="2"
            data-port-id="command" data-medium="electrical"
            data-port-role="signal_in" data-flow-capability="none"
            data-anchor-direction="up"/>
  </g>
</svg>
