<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300">
  <!-- 描边符号验证图。用浏览器打开查看形状与对齐。
       上排:实际符号,含接线示意。下排:端口标记显形(仅验证用)。 -->
  <rect x="0" y="0" width="620" height="300" fill="#ffffff"/>

  <text x="20" y="30" font-family="sans-serif" font-size="13" fill="#333">描边符号验证 — 上排为出图效果,下排显示端口标记位置</text>

  <!-- ===== 上排:串联接线,验证中心线齐平 ===== -->
  <g fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 引入管 -->
    <line x1="30" y1="110" x2="70" y2="110"/>

    <!-- check_valve 实例 @ (70,70) -->
    <g transform="translate(70,70)">
      <line x1="0" y1="40" x2="27" y2="40"/>
      <line x1="56" y1="40" x2="80" y2="40"/>
      <path d="M40 26 L27 40 L40 54"/>
      <circle cx="48" cy="40" r="8"/>
    </g>

    <!-- 中间连接段 -->
    <line x1="150" y1="110" x2="230" y2="110"/>

    <!-- filter 实例 @ (230,70) -->
    <g transform="translate(230,70)">
      <line x1="0" y1="40" x2="18" y2="40"/>
      <line x1="62" y1="40" x2="80" y2="40"/>
      <path d="M18 40 L40 18 L62 40 L40 62 Z"/>
      <line x1="40" y1="18" x2="40" y2="62" stroke-dasharray="5 4"/>
    </g>

    <!-- 引出管 + 三通实心节点 -->
    <line x1="310" y1="110" x2="420" y2="110"/>
    <line x1="380" y1="110" x2="380" y2="170"/>
  </g>
  <circle cx="380" cy="110" r="4" fill="#000000"/>

  <text x="72" y="230" font-family="sans-serif" font-size="11" fill="#666">check_valve</text>
  <text x="232" y="230" font-family="sans-serif" font-size="11" fill="#666">filter</text>
  <text x="352" y="192" font-family="sans-serif" font-size="11" fill="#666">三通</text>

  <!-- 中心线基准 -->
  <line x1="20" y1="110" x2="440" y2="110" stroke="#00a0d0" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="446" y="113" font-family="sans-serif" font-size="10" fill="#00a0d0">Y=110 中心线齐平</text>

  <!-- ===== 下排:端口标记显形 ===== -->
  <g transform="translate(0,120)">
    <g fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(70,70)">
        <line x1="0" y1="40" x2="27" y2="40"/>
        <line x1="56" y1="40" x2="80" y2="40"/>
        <path d="M40 26 L27 40 L40 54"/>
        <circle cx="48" cy="40" r="8"/>
      </g>
      <g transform="translate(230,70)">
        <line x1="0" y1="40" x2="18" y2="40"/>
        <line x1="62" y1="40" x2="80" y2="40"/>
        <path d="M18 40 L40 18 L62 40 L40 62 Z"/>
        <line x1="40" y1="18" x2="40" y2="62" stroke-dasharray="5 4"/>
      </g>
    </g>
    <!-- 端口标记:出图时 visibility=hidden,此处显形 -->
    <g fill="#ff0000">
      <circle cx="70" cy="110" r="3"/><circle cx="150" cy="110" r="3"/>
      <circle cx="230" cy="110" r="3"/><circle cx="310" cy="110" r="3"/>
    </g>
    <g font-family="sans-serif" font-size="9" fill="#c00">
      <text x="52" y="128">inlet</text><text x="136" y="128">outlet</text>
      <text x="212" y="128">inlet</text><text x="296" y="128">outlet</text>
    </g>
    <!-- viewBox 框 -->
    <g fill="none" stroke="#00a0d0" stroke-width="0.5" stroke-dasharray="2 2">
      <rect x="70" y="70" width="80" height="80"/>
      <rect x="230" y="70" width="80" height="80"/>
    </g>
    <text x="446" y="113" font-family="sans-serif" font-size="10" fill="#00a0d0">端口在 viewBox 左右边界</text>
  </g>
</svg>
