<?xml version="1.0" encoding="UTF-8"?>
<!--
  Test hydraulic schematic: Reservoir -> Priority Valve -> Reservoir.
  Concept diagram only; it does not define a released hydraulic design.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="820" viewBox="0 0 1200 820" role="img"
     aria-labelledby="title description">
  <title id="title">油箱与优先阀闭环连接测试</title>
  <desc id="description">油箱下游端口连接优先阀入口，优先阀出口回接油箱增压输入端口。</desc>
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b5cab"/>
    </marker>
    <style>
      .pipe { fill:none; stroke:#0b5cab; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .pipe-return { fill:none; stroke:#27834d; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .port { fill:#fff; stroke:#0b5cab; stroke-width:4; }
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill:#1a2733; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>
  <rect x="30" y="30" width="1140" height="760" rx="12" fill="none" stroke="#cbd5df" stroke-width="2"/>
  <text class="label" x="70" y="88" font-size="30" font-weight="700">油箱—优先阀—油箱：连接测试原理图</text>
  <text class="label" x="70" y="122" font-size="17" fill="#526474">概念验证；蓝色为下游供压，绿色为回油/回接路径。</text>

  <!-- Original library symbols, retained as externally linked editable SVG assets. -->
  <image x="110" y="170" width="260" height="670" preserveAspectRatio="xMidYMid meet"
         href="Bootstrap Type Reservoir.svg" xlink:href="Bootstrap Type Reservoir.svg"/>
  <image x="600" y="350" width="400" height="222" preserveAspectRatio="xMidYMid meet"
         href="Priority Valve.svg" xlink:href="Priority Valve.svg"/>

  <!-- Reservoir lower port (185, 658) -> priority-valve inlet (612, 428). -->
  <path class="pipe" d="M 185 658 L 430 658 L 430 428 L 612 428" marker-end="url(#flow-arrow)"/>
  <!-- Priority-valve outlet (977, 430) -> reservoir pressure-in port (316, 755). -->
  <path class="pipe-return" d="M 977 430 L 1080 430 L 1080 730 L 316 730 L 316 755" marker-end="url(#flow-arrow)"/>

  <!-- Explicit connection markers overlay the semantic ports in the source symbols. -->
  <circle class="port" cx="185" cy="658" r="9"/>
  <circle class="port" cx="612" cy="428" r="9"/>
  <circle class="port" cx="977" cy="430" r="9" stroke="#27834d"/>
  <circle class="port" cx="316" cy="755" r="9" stroke="#27834d"/>

  <g class="label" font-size="18">
    <rect x="208" y="617" width="169" height="34" rx="5" fill="#eaf3ff"/>
    <text x="220" y="641">下游：油箱 → 优先阀</text>
    <rect x="675" y="684" width="190" height="34" rx="5" fill="#eaf7ef"/>
    <text x="687" y="708">回接：优先阀 → 油箱</text>
    <text x="130" y="155" font-weight="700">R-001  自增压液压油箱</text>
    <text x="685" y="330" font-weight="700">PV-001  优先阀</text>
  </g>
  <g class="label" font-size="15" fill="#526474">
    <text x="130" y="780">R-001 下游端口：port-reservoir-lower</text>
    <text x="130" y="805">R-001 回接端口：port-bootstrap-pressure-in</text>
    <text x="605" y="600">PV-001 入口：port-reservoir-lower；出口：port-bootstrap-pressure-in</text>
  </g>
</svg>
