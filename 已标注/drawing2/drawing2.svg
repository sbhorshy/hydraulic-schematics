<?xml version="1.0" encoding="UTF-8"?>
<!-- 由 Drawing2.dxf (AutoCAD 2018) 转换:坐标 x10,Y 轴翻转(y' = 343.66 - 10·y,
     SVG y 向下,视角与 AutoCAD 一致)。全部为可编辑矢量图元,按元件分组、图元带语义 id
     (id 方位以 SVG 视觉上下为准)。
     v1.1:增补主油路 main-line——自二位二通阀下油口正交走线至右侧单向阀下油口
     (CAD 原图两元件间无连线);走线 M147.15 240.26 H364.43 V209.86,零交叉、两处直角折弯。
     v1.2:修两处转换缺陷——
       1) pump-arc 弧线 Y 翻转后 sweep 档未纠正,弧向反了(鼓向阀体一侧),
          改回 sweep=0,弧向左包,两个方向箭头尖端重新与弧端相接;
       2) 阀流向箭头 valve-flow-arrow:ezdxf 对带镜像的 INSERT 求解块内 SOLID 时
          x 坐标取反,箭头被甩到电动机旁;按 AutoCAD 变换语义(x 取反还原)归位至
          阀左块内部通路下方,尖朝下(常开工位流向,与下油口出油方向一致)。
     v1.3:单向阀两段油口均接回主油路——新增 main-run-upper:主阀上油口端头
       (147.35,0) 水平右行至单向阀正上方,下折接入上油口 (364.54,67.83);
       加下油口原有的 main-run,单向阀前(下口进油)后(上口出油)皆有油路,
       与主阀竖线构成回路。零交叉。
     v1.4:主油路上下两端各延 50 引出图外并加系统接口 port-main-upper/lower
       (红点,与库端口同款 r=2);上下分叉点为真实三通,补实心节点
       junction-upper/lower(r=4.5,库规 JUNC_R);viewBox 高度 300.28 -> 400.28。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-181.12 -80.0 603.83 400.28" width="603.83" height="400.28">
  <g id="drawing" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 传动轴双线 + 定量泵(半弧+双三角,CAD 主图散画图元);弧+双箭头为旋转/流向指示 -->
    <g id="pump-shaft">
      <line x1="26.24" y1="124.67" x2="96.98" y2="124.67" id="shaft-lower"/>
      <line x1="26.05" y1="104.67" x2="96.98" y2="104.67" id="shaft-upper"/>
      <polygon points="56.5,87.93 64.54,93.18 76.26,66.44" fill="#000000" stroke="none" id="pump-triangle-upper"/>
      <polygon points="56.5,144.57 64.54,139.32 76.26,166.06" fill="#000000" stroke="none" id="pump-triangle-lower"/>
      <path d="M 76.62 66.26 A 70.31 70.31 0 0 0 76.67 166.28" id="pump-arc"/>
    </g>
    <!-- 二位二通阀(常开):双方块,左块 position1 为通油工位(上下油口);右块为另一工位(通路+节流位标记) -->
    <g id="valve-2way-no">
      <line x1="147.35" y1="69.88" x2="147.35" y2="0.0" id="port-upper"/>
      <line x1="147.15" y1="169.67" x2="147.15" y2="240.28" id="port-lower"/>
      <line x1="147.32" y1="69.67" x2="147.32" y2="169.83" id="position1-passage"/>
      <line x1="247.3" y1="94.83" x2="247.3" y2="69.67" id="position2-passage-upper"/>
      <line x1="237.35" y1="94.83" x2="257.35" y2="94.83" id="position2-tick-upper"/>
      <line x1="257.35" y1="144.83" x2="237.35" y2="144.83" id="position2-tick-lower"/>
      <line x1="247.3" y1="169.67" x2="247.3" y2="144.83" id="position2-passage-lower"/>
      <line x1="97.36" y1="69.67" x2="197.36" y2="69.67" id="box-top-left"/>
      <line x1="197.36" y1="69.67" x2="297.36" y2="69.67" id="box-top-right"/>
      <line x1="97.36" y1="169.67" x2="97.36" y2="69.67" id="box-left"/>
      <line x1="297.36" y1="69.67" x2="297.36" y2="169.67" id="box-right"/>
      <line x1="197.33" y1="70.03" x2="197.33" y2="170.03" id="box-mid"/>
      <line x1="297.36" y1="169.67" x2="97.36" y2="169.67" id="box-bottom"/>
      <!-- 流向箭头:常开工位流动方向,通路下方、尖朝下(与下油口出油方向一致)。
           转换修正:ezdxf 对带镜像 INSERT 的块内 SOLID 把 x 取反,已按 AutoCAD 变换语义归位 -->
      <polygon points="142.72,144.63 151.12,144.63 146.92,169.83" fill="#000000" stroke="none" id="valve-flow-arrow"/>
    </g>
    <!-- 单向阀(带弹簧):V 形座+球+弹簧,油口上下,流向自下而上顶开球阀 -->
    <g id="check-valve">
      <line x1="336.14" y1="131.6" x2="364.42" y2="159.88" id="seat-left"/>
      <line x1="364.42" y1="159.88" x2="392.71" y2="131.6" id="seat-right"/>
      <circle cx="364.37" cy="135.27" r="16.65" id="ball"/>
      <line x1="364.43" y1="159.85" x2="364.43" y2="209.85" id="port-bottom"/>
      <line x1="364.54" y1="117.83" x2="364.54" y2="67.83" id="port-top"/>
      <g id="spring">
        <line x1="384.12" y1="90.2" x2="346.63" y2="78.93" id="spring-1"/>
        <line x1="346.75" y1="101.47" x2="384.12" y2="90.2" id="spring-2"/>
        <line x1="384.12" y1="112.74" x2="346.75" y2="101.47" id="spring-3"/>
        <line x1="346.63" y1="123.86" x2="384.12" y2="112.74" id="spring-4"/>
      </g>
    </g>
    <!-- 电动机 M -->
    <g id="motor-m">
      <text id="motor-text" x="-23.04" y="125.9" font-size="32" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">M</text>
      <circle cx="-23.04" cy="114.87" r="50.0" id="motor-circle"/>
    </g>
    <!-- 主油路(增补):二位二通阀下油口 -> 单向阀下油口,正交走线,两处直角折弯 -->
    <g id="main-line">
      <path id="main-run" d="M 147.15 240.26 H 364.43 V 209.86"/>
      <!-- 上段回路(增补):主阀上油口 -> 单向阀上油口 -->
      <path id="main-run-upper" d="M 147.35 0 H 364.54 V 67.83"/>
      <!-- 上下端引出:主油路延至系统接口 -->
      <line id="main-run-upper-ext" x1="147.35" y1="0" x2="147.35" y2="-50"/>
      <line id="main-run-lower-ext" x1="147.15" y1="240.28" x2="147.15" y2="290"/>
      <!-- 真实三通分叉点(上:引出+回路分支;下:引出+回路分支) -->
      <circle id="junction-upper" cx="147.35" cy="0" r="4.5" fill="#000000" stroke="none"/>
      <circle id="junction-lower" cx="147.15" cy="240.26" r="4.5" fill="#000000" stroke="none"/>
    </g>
    <!-- 系统接口(增补):主油路上下端,红点与库端口同款 -->
    <g id="ports">
      <circle id="port-main-upper" cx="147.35" cy="-50" r="2" fill="#ff0000"
              data-port-id="main_upper" data-medium="hydraulic" data-port-role="pressure"
              data-flow-capability="bidirectional" data-anchor-direction="up"/>
      <circle id="port-main-lower" cx="147.15" cy="290" r="2" fill="#ff0000"
              data-port-id="main_lower" data-medium="hydraulic" data-port-role="pressure"
              data-flow-capability="bidirectional" data-anchor-direction="down"/>
    </g>
  </g>
</svg>
