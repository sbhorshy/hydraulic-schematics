<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 7 132 70"
     width="132" height="70"
     data-component-type="temperature_transducer"
     data-symbol-version="1.1"
     data-symbol-form="stroke_geometry"
     data-symbol-status="provisional"
     data-symbol-source-ref="root/Temperature Transducer.svg potrace traced original, 4.0 px per unit measured">

  <!-- 描边几何重绘,取代根目录 potrace 描摹填充版 Temperature Transducer.svg。
       几何依据:对原描摹件按 4.0 px/单位实测(3x 渲染 + 像素行程分析)。
       原 viewBox 143x82,内容 x 0..126 / y 12..71 偏左上,本版收紧为
       viewBox "0 7 132 70"(内容竖向居中,左右留白 4/7):
         感温包小方框 x 26.6..67.3 / y 22.5..58 (41x35.5)。沿用 temperature-switch.svg
           的用户确认约定:左框为正方形,且与变送框共边(右缘=大框左缘)不变
           -> 本图 x 31..67 / y 22..58 (36x36 正方形,竖向中线 y=40 与感温线同高)
         变送大方框 x 67.3..124.2 / y 15..69 -> 本图 x 67..124 / y 15..69 (57x54)
         感温短线:接口处不连续(同温度开关约定)——外段止于方框左缘,框内感温线为
           悬浮独立线段(原图断口≈5.4) -> 外段 (6,40)-(31,40);内段 (36,40)-(53,40)
         感温圆 ≈(56,40.4) r≈3 -> (56,40) r=3 (绝对位置按实测保留)
         变送元件(大框内):
           上凸弧线 自 (74,29.5) 经顶点 ≈(96.5,22.3) 至 (118,28.5)
             -> 二次贝塞尔 M74 29.5 Q96.5 15.6 118 28.5 (顶点过 (96.5,22.3))
           斜臂 自弧线左端 ≈(81,29.5) 斜向右下,止于下端实心圆 -> 两点连线
           下端实心圆 ≈(96.5,62) r≈3.6 -> (96.5,62) r=3.5

       v1.1(按 _template.svg 门禁合规修订,符号几何一像素未动):
         - 感温外段左延 6 -> 0,端口 temp_sense 落 viewBox 左边界 (0,40) (§6.4-10);
         - 新增电信号口 elec_out:变送框顶边中部 (95.5,15) 向上引线至顶边界
           (95.5,7),渲染器自端头连线(画法同 pressure-switch.svg 头注约定);
         - 实心指示圆点(感温圆/变送下端圆)改闭合双弧路径实现:门禁 C8 放行
           "顶点<=4 且闭合"的短路径(实心箭头/三角判例),按技术规范 §6.4-8
           "实心箭头、三角等指示性图元除外(显式 stroke=none)"办理,外观仍为实测圆形。

       端口(catalog v0.1-draft 已增补 temperature_transducer 条目,与本图双向一致):
         port-temp-sense:感温取压口,medium=hydraulic,role=measurement,
           flow=none,anchor=left,位于感温线自由端 (0,40)。
         port-elec-out:电信号口,medium=electrical,role=signal_out,
           flow=none,anchor=up,位于顶边引线端头 (95.5,7)。
           原图无外部电引线(变送元件画在框内即表意),引出方向按
           pressure_switch 家族惯例推断。

       未确认项(引用本符号的 L0 文件须在 unknown 登记):
         - 无标准页依据(status=provisional);
         - elec_out 引出方向(up)为家族惯例推断,非原件实测。

       线宽 stroke-width=2 (基准 T);端口坐标为精确几何端点。 -->

  <g id="symbol" fill="none" stroke="#000000" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- 感温包正方形(36x36,右缘与变送框左缘共边) -->
    <path id="bulb-housing" d="M31 22 H67 V58 H31 Z"/>
    <!-- 变送大方框 -->
    <path id="transducer-housing" d="M67 15 H124 V69 H67 Z"/>
    <!-- 感温短线:外段自 viewBox 左边界止于方框左缘;框内为悬浮独立线段(接口处
         不连续),端头感温圆 -->
    <line id="temp-sense-line" x1="0" y1="40" x2="31" y2="40"/>
    <line id="bulb-line-inner" x1="36" y1="40" x2="53" y2="40"/>
    <!-- 实心感温圆 (56,40) r=3,双弧路径(见头注 v1.1) -->
    <path id="bulb-dot" d="M53 40 A3 3 0 1 0 59 40 A3 3 0 1 0 53 40 Z"
          fill="#000000" stroke="none"/>
    <!-- 电信号口引线:变送框顶边中部 (95.5,15) 向上至 viewBox 顶边界 -->
    <line id="elec-out-line" x1="95.5" y1="15" x2="95.5" y2="7"/>
    <!-- 变送元件:上凸弧线 + 斜臂 + 下端实心圆(双弧路径) -->
    <path id="transducer-arc" d="M74 29.5 Q96.5 15.6 118 28.5"/>
    <line id="transducer-arm" x1="83.5" y1="34" x2="96.5" y2="62"/>
    <path id="transducer-dot" d="M93 62 A3.5 3.5 0 1 0 100 62 A3.5 3.5 0 1 0 93 62 Z"
          fill="#000000" stroke="none"/>
    <polygon id="transducer-arrow" points="81,27 80,39 89,35"
         fill="#000000" stroke="none"/>
  </g>

  <g id="connection-points" fill="#ff0000">
    <circle id="port-temp-sense" cx="0" cy="40" r="2"
            data-port-id="temp_sense"
            data-medium="hydraulic"
            data-port-role="measurement"
            data-flow-capability="none"
            data-anchor-direction="left"/>
    <circle id="port-elec-out" cx="95.5" cy="7" r="2"
            data-port-id="elec_out"
            data-medium="electrical"
            data-port-role="signal_out"
            data-flow-capability="none"
            data-anchor-direction="up"/>
  </g>
</svg>
