<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 26 394 210"
     width="394" height="210"
     data-component-type="temperature_switch"
     data-symbol-version="1.1"
     data-symbol-form="stroke_geometry"
     data-symbol-status="provisional"
     data-symbol-source-ref="root/Temperature Switch.svg potrace traced original, 4.0 px per unit measured">

  <!-- 描边几何重绘,取代根目录 potrace 描摹填充版 Temperature Switch.svg。
       几何依据:对原描摹件按 4.0 px/单位实测(3x 渲染 + 像素行程分析)。
       原 viewBox 444x252,内容 x 0..386 / y 43..219 偏左上,本版收紧为
       viewBox "0 26 394 210"(内容竖向居中,左右留白 4/13):
         感温包小方框 x 77..215 / y 71..190。用户确认:左框为正方形,且与开关框
           共边(右缘=大框左缘)不变 -> 本图 x 104..208 / y 78..182 (104x104 正方形,
           竖向中线 y=130 与感温线同高)
         开关大方框 x 202..386 / y 43..219   -> 本图 x 208..380 / y 50..212 (172x162)
         感温短线:用户确认接口处线段不连续——外段止于方框左缘,框内感温线为
           悬浮独立线段(间隙≈14,与原图断口位置一致):
           外段 (6,130)-(104,130);内段 (118,130)-(170,130);端头实心感温圆
         感温圆 ≈(171,131) r≈13      -> (171,130) r=13 (绝对位置按实测保留)
         开关触点(大框内,全实心圆):
           铰点圆   ≈(244.5,103) r≈12..14.5 -> (244,103) r=13
           动臂     自铰点斜向右下,止于动触点圆 -> 两圆心连线
           动触点圆 ≈(294,186.5) r≈11     -> (294,186) r=11
           固定触点圆 ≈(354,103) r≈11     -> (354,103) r=11
           触点断开位:动触点在下,固定触点在右上,二者分离
       触点画法与 pressure-switch.svg 同款。

       v1.1(按 _template.svg 门禁合规修订,符号几何一像素未动):
         - 感温外段左延 6 -> 0,端口 temp_sense 落 viewBox 左边界 (0,130) (§6.4-10);
         - 新增电信号口 elec_out:大框顶边中部 (294,50) 向上引线至顶边界 (294,26),
           渲染器自端头连线(画法同 pressure-switch.svg 头注约定);
         - 实心指示圆点(感温圆/铰点/动触点/固定触点)改闭合双弧路径实现:
           门禁 C8 放行"顶点<=4 且闭合"的短路径(实心箭头/三角判例),
           按技术规范 §6.4-8"实心箭头、三角等指示性图元除外(显式 stroke=none)"
           办理,外观仍为实测圆形。

       端口(catalog v0.1-draft 已增补 temperature_switch 条目,与本图双向一致):
         port-temp-sense:感温取压口,medium=hydraulic,role=measurement,
           flow=none,anchor=left,位于感温线自由端 (0,130)。
         port-elec-out:电信号口,medium=electrical,role=signal_out,
           flow=none,anchor=up,位于顶边引线端头 (294,26)。
           原图无外部电引线(触点画在框内即表意),引出方向按
           pressure_switch 家族惯例推断。

       未确认项(引用本符号的 L0 文件须在 unknown 登记):
         - 无标准页依据(status=provisional),触点画法沿用 pressure-switch 同款;
         - elec_out 引出方向(up)为家族惯例推断,非原件实测。

       线宽 stroke-width=2 (基准 T);端口坐标为精确几何端点。 -->

  <g id="symbol" fill="none" stroke="#000000" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- 感温包正方形(104x104,右缘与开关框左缘共边) -->
    <path id="bulb-housing" d="M104 78 H208 V182 H104 Z"/>
    <!-- 开关大方框 -->
    <path id="switch-housing" d="M208 50 H380 V212 H208 Z"/>
    <!-- 感温短线:外段自 viewBox 左边界止于方框左缘;框内为悬浮独立线段(接口处
         不连续),端头感温圆 -->
    <line id="temp-sense-line" x1="0" y1="130" x2="104" y2="130"/>
    <line id="bulb-line-inner" x1="118" y1="130" x2="170" y2="130"/>
    <!-- 实心感温圆 (171,130) r=13,双弧路径(见头注 v1.1) -->
    <path id="bulb-dot" d="M158 130 A13 13 0 1 0 184 130 A13 13 0 1 0 158 130 Z"
          fill="#000000" stroke="none"/>
    <!-- 电信号口引线:大框顶边中部 (294,50) 向上至 viewBox 顶边界 -->
    <line id="elec-out-line" x1="294" y1="50" x2="294" y2="26"/>
    <!-- 电开关触点:铰点、动臂、动触点、固定触点(断开位),实心圆点双弧路径 -->
    <path id="pivot-dot" d="M231 103 A13 13 0 1 0 257 103 A13 13 0 1 0 231 103 Z"
          fill="#000000" stroke="none"/>
    <line id="contact-arm" x1="248" y1="83" x2="294" y2="186"/>
    <path id="movable-dot" d="M283 186 A11 11 0 1 0 305 186 A11 11 0 1 0 283 186 Z"
          fill="#000000" stroke="none"/>
    <path id="fixed-dot" d="M343 103 A11 11 0 1 0 365 103 A11 11 0 1 0 343 103 Z"
          fill="#000000" stroke="none"/>
  </g>

  <g id="connection-points" fill="#ff0000">
    <circle id="port-temp-sense" cx="0" cy="130" r="2"
            data-port-id="temp_sense"
            data-medium="hydraulic"
            data-port-role="measurement"
            data-flow-capability="none"
            data-anchor-direction="left"/>
    <circle id="port-elec-out" cx="294" cy="26" r="2"
            data-port-id="elec_out"
            data-medium="electrical"
            data-port-role="signal_out"
            data-flow-capability="none"
            data-anchor-direction="up"/>
  </g>
</svg>
