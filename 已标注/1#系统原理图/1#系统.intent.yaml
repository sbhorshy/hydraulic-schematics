# L0 系统意图：1# 液压系统（全系统清单）
#
# 来源：1#系统组件.json
# 该 JSON 是**类型清单**，只有 17 个中文类型名。它不含数量、不含拓扑、
# 不含端口。本文件忠实转换清单本身，不代为编造连接关系。
#
# 状态：草案，尚不可绘图。17 个类型里 10 个不在组件目录内，
#   目录外类型的端口不存在，按 L0 规范 10.2 不得出现在 paths 中。
#   因此 paths 只有可写的片段，不是完整拓扑。

l0_version: "1.1"
system: HYD-SYS-1-FULL

# 目录已存在但 status 为 draft_not_frozen，此处的钉号不可复现。
# 目录冻结后必须改为冻结修订号。
catalog: "comac-hydraulic-components@0.1-draft"
maturity: concept

# 地面勤务侧边界。快卸接头与集中加油的地面侧必然是开口。
extern:
  GND-PRS-001: inlet     # 地面压力快卸接头的地面侧
  GND-RET-001: return    # 地面回油快卸接头的地面侧
  GND-FILL-001: inlet    # 集中加油的地面侧
  # 油箱已在 parts 中声明为 RSV-001，故壳体回油理应回到油箱端口，
  # 不是外部边界。但 RSV-001 端口未定义，此处暂用边界标记占位。
  RET-CD-001: return     # EDP 壳体回油边界（待并入 RSV-001）

# 数量未声明。JSON 每个类型只出现一次，本文件即按 1 实例转换。
# 这与你此前口述的"两个壳体回油滤、一个回油滤"冲突，见 unknown 段。
parts:
  # —— 目录内（7）——
  EDP-001: engine_driven_pump
  EMP-001: electric_motor_driven_pump
  FSOV-001: firewall_shutoff_valve
  PF-001: pressure_filter
  CDF-001: case_drain_filter
  CV-001: check_valve                        # 地面加油单向阀
  ACC-001: hydro_pneumatic_accumulator       # 系统蓄压器

  # —— 目录外（10）。类型名为占位，端口未定义，不可进 paths ——
  RSV-001: reservoir                         # 油箱
  PRV-001: priority_valve                    # 优先阀（符号 v1.6，等标准页）
  BPRV-001: bootstrap_priority_valve         # 自增压优先阀
  PTU-001: power_transfer_unit               # 能源转换装置
  PTUSV-001: ptu_selector_valve              # 能源转换装置选择阀
  GSC-PRS-001: ground_service_coupling       # 地面压力快卸接头
  GSC-RET-001: ground_service_coupling       # 地面回油快卸接头
  CFA-001: centralized_fill_assembly         # 集中加油组件
  ACG-001: accumulator_charging_gauge_assembly  # 蓄压器充气压力表组件
  USR-001: consumer_group                    # 用户

# 源 JSON 不含任何连接关系。以下 5 条是**唯一**可从
# system-1.intent.yaml 已确认部分继承的路径，全部只涉及目录内类型。
# 其余 12 个类型之间怎么连，源清单没说，我不代填。
paths:
  - ["EDP-001.pressure_out", "@PRESS"]
  - ["EMP-001.pressure_out", "@PRESS"]
  - ["@PRESS", PF-001, "@MANIFOLD"]
  - ["@MANIFOLD", "ACC-001.hydraulic_port"]
  - ["EDP-001.case_drain", CDF-001, RET-CD-001]

# PTU 传递功率不传递液体，按 L0 规范 11.3 必须走 couple 而非 paths。
# 但 PTU-001 两侧端口名未定义，本节暂空。
# couple:
#   - {kind: power_transfer, from: PTU-001.side_a, to: PTU-001.side_b}

groups:
  - id: LRU-GND-001
    label: 地面勤务组件
    members: [GSC-PRS-001, GSC-RET-001, CFA-001, CV-001]
    reason: zone
  - id: LRU-ACC-001
    label: 蓄压器及充气表组件
    members: [ACC-001, ACG-001]
    reason: zone

unknown:
  # —— 源清单本身的缺陷 ——
  - component_quantities_not_declared
  - topology_not_declared
  - ten_types_absent_from_catalog
  # —— 与此前口述冲突 ——
  - case_drain_filter_count_conflict      # 口述 2 个，清单 1 个
  - return_filter_absent_from_list        # 口述有回油滤，清单无
  - fwsov_position_suction_or_pressure
  # —— 缺失的功能必需件 ——
  - system_relief_valve_not_declared
  - pump_isolation_check_valves_not_declared
  - accumulator_gas_charging_valve_not_declared
  - no_instrumentation_declared
  # —— 目录外类型的端口定义 ——
  - PRV-001.port_definition
  - BPRV-001.port_definition
  - PTU-001.port_definition
  - PTUSV-001.port_definition
  - RSV-001.port_definition
  - CFA-001.port_definition
  - USR-001.port_definition
  # —— 参数 ——
  - system_pressure_class
  - operating_modes
