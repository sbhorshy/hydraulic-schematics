# L0: 1# 系统压力油滤组件(真实构型)
# 依据:工程师提供的原理图照片 + 口述"压力油滤上集成了两个压力开关、
#   一个压差指示器、一个压力传感器、一个 relief valve"
# 与 test-two-inlet-pressure-switch-filter-relief 同构,后者为本组件的简化版
# 状态:草案。4 处待确认见 unknown;DPS/PT 两类型目录中不存在

l0_version: "1.2"          # taps 新增 between 形式,用于跨两点的压差测量
system: HYD-SYS-1-PF-ASSY
catalog: "comac-hydraulic-components@0.1-draft"
maturity: concept

extern:
  IN-001: inlet
  IN-002: inlet
  OUT-001: outlet
  RET-001: return          # 泄压阀去向,待确认

parts:
  PS-001: pressure_switch
  PS-002: pressure_switch
  CV-001: check_valve
  CV-002: check_valve
  PF-001: pressure_filter              # 符号含 line shutoff 特征(合并)
  RV-001: relief_valve
  DPS-001: differential_pressure_sensor  # 目录中不存在
  PT-001: pressure_transducer            # 目录中不存在

paths:
  - [IN-001, CV-001, "@MERGE"]
  - [IN-002, CV-002, "@MERGE"]
  - ["@MERGE", PF-001, OUT-001]

taps:
  - {sensor: PS-001, at: CV-001.inlet, position: upstream}
  - {sensor: PS-002, at: CV-002.inlet, position: upstream}
  - {sensor: PT-001, at: PF-001.outlet, position: downstream}
  - {sensor: DPS-001, between: [PF-001.inlet, PF-001.outlet]}

relief:
  - {valve: RV-001, from: PF-001.outlet, to: RET-001}

groups:
  - id: LRU-PF-001
    label: 压力油滤
    members: [PS-001, PS-002, CV-001, CV-002, PF-001, RV-001, DPS-001, PT-001]
    reason: not_field_removable

unknown:
  - DPS-001_indicator_or_sensor        # 有无电输出,决定是否声明电气端口
  - RV-001_bypass_or_relief_to_return  # 滤芯旁通 还是 泄放至回油
  - CV_membership_in_LRU               # 单向阀是否属于本组件
  - PS_PT_membership_in_LRU            # 压力开关与压力传感器是否在虚线框内
