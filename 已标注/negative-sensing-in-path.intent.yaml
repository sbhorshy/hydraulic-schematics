# L0 负样例：把取压元件写进主油路
# 预期结果：ERROR，不产出 L2、审查卡或 SVG
# 用途：验证 L0 规范 10.5 与校核 15.3 第 10 条

l0_version: "1.1"
system: NEGATIVE-SENSING-IN-PATH
catalog: comac-hydraulic-components@A
maturity: concept

extern:
  IN-001: inlet
  OUT-001: outlet

parts:
  PS-001: pressure_switch
  CV-001: check_valve

# 违规行：把 PS-001 当作串联元件。
# 这正是自然语言"在压力开关后有单向阀"会被误解成的拓扑。
paths:
  - [IN-001, PS-001, CV-001, OUT-001]

unknown:
  - pressure_class
