<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60"
     width="120" height="60"
     data-component-type="hydraulic_user"
     data-symbol-version="1.0"
     data-symbol-form="stroke_geometry"
     data-symbol-status="provisional"
     data-symbol-source-ref="NONE_NO_STANDARD_PAGE_SUPPLIED">

  <!-- ============================================================
       通用用户(用油设备)框。矩形+用户名,左压力入口/右回油出口。
       用户名不写死在本文件——text#user-name 带 data-name-slot,
       是渲染器写入实例名的文本槽;单独打开本文件看到的是占位"用户"。
       由 _template.svg 起稿(技术规范 §6.3.1)。
       ============================================================ -->

  <!-- 依据: 本库约定(2026-08-31 需求定义):所有用户画成"用户名+外框长方形",
       带压力入口与回油口。构造自通用符号族,无标准页条款。
       未确认项: 无标准页依据(status=provisional);引用本符号的 L0 文件
       须在 unknown 登记或按 concept 成熟度披露。 -->

  <g id="symbol" fill="none" stroke="#000000" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- 用户框本体:名字画在框内 -->
    <rect id="user-box" x="20" y="8" width="80" height="44"/>

    <!-- 端口引线: 左=压力入口,右=回油出口 -->
    <line id="port-stub-left" x1="20" y1="30" x2="0" y2="30"/>
    <line id="port-stub-right" x1="100" y1="30" x2="120" y2="30"/>

    <!-- 用户名文本槽:渲染器按实例标签替换内容(单行/多行 tspan);
         框内居中。fill 文字必须填充才可见,非描摹轮廓。 -->
    <text id="user-name" data-name-slot="1"
          x="60" y="34" text-anchor="middle" font-size="12"
          fill="#000000" stroke="none"
          font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">用户</text>
  </g>

  <g id="connection-points" fill="#ff0000">
    <circle id="port-pressure-in" cx="0" cy="30" r="2"
            data-port-id="pressure_in"
            data-medium="hydraulic"
            data-port-role="pressure"
            data-flow-capability="in"
            data-anchor-direction="left"/>
    <circle id="port-return-out" cx="120" cy="30" r="2"
            data-port-id="return_out"
            data-medium="hydraulic"
            data-port-role="return"
            data-flow-capability="out"
            data-anchor-direction="right"/>
  </g>
</svg>
