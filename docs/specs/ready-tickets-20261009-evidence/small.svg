  .ext-mark { stroke: #000; stroke-width: 1.20; }
  polyline { fill: none; stroke: #000;
             stroke-linecap: butt; stroke-linejoin: miter; }
  .ln-pressure   { stroke-width: 3.60; }
  .ln-return     { stroke-width: 1.20; }
  .ln-suction    { stroke-width: 1.20; }
  .ln-case_drain { stroke-width: 1.20; }
  .ln-sense      { stroke-width: 1.20; }
  .suc-mark { stroke: #000; stroke-width: 1.20;
              stroke-linecap: butt; }
  .jn { fill: #000; }
  .dang { fill: none; stroke: #d00000; stroke-width: 1.80; }
  .brg-hi { fill: none; stroke: #000; stroke-width: 3.60;
            stroke-linecap: butt; }
  .brg-lo { fill: none; stroke: #000; stroke-width: 1.20;
            stroke-linecap: butt; }
  .banner { font-size: 15px; font-weight: bold; fill: #b00000; }
  .tb  { fill: none; stroke: #000; stroke-width: 1.20; }
  .tb-t{ font-size: 11px; fill: #000; }
  .lg  { fill: #fff; stroke: #000; stroke-width: 1.20; }
  .lg-t{ font-size: 10.5px; fill: #000; }

  /* 组件本体线宽:企业标准 1.5 T,一处定义。
     曾用 vector-effect: non-scaling-stroke 来抵消符号的落位缩放,
     那是错的:该属性把线宽钉在**设备像素**上,于是整图放大出图时
     管线随之变粗、而符号内的线纹丝不动(实测 1x/2x/3x 下管线
     4/8/10px,引线恒为 4px)。改为在实例上按 1/k 补偿,
     线宽随图缩放,同时不受符号自身缩放影响。 */
  :root { --kc: 1; }
  /* fill:none 必须图纸级补回:read_symbol 只嵌形状不嵌符号内样式表,
     缺了它 SVG 默认 fill=black,凡描边符号(油箱壳体等)整只糊成黑块。 */
  .sym-outline { fill: none; stroke: currentColor;
                 stroke-width: calc(1.80 * var(--kc)); }
  .sym-body-width { stroke-width: calc(1.80 * var(--kc) * var(--body-scale, 1)); }

  /* 符号外接引线随相接管网等级,包含气侧 sense 支路。
     按已声明连接判断,不以介质排除整类已连接端口。
     端口类直接作用于各类引线图元,覆盖继承的 sym-outline 线宽。
     注:style 内容未包 CDATA,注释里不可出现尖括号,会破坏 XML。 */
  .pl-pressure   { stroke-width: calc(3.60 * var(--kc) * var(--lead-scale, 1)); }
  .pl-return     { stroke-width: calc(1.20 * var(--kc) * var(--lead-scale, 1)); }
  .pl-suction    { stroke-width: calc(1.20 * var(--kc) * var(--lead-scale, 1)); }
  .pl-sense      { stroke-width: calc(1.20 * var(--kc) * var(--lead-scale, 1)); }
  .pl-case_drain { stroke-width: calc(1.20 * var(--kc) * var(--lead-scale, 1)); }
</style>
