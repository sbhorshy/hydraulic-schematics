<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 218 564"
     width="218" height="564"
     data-component-type="bootstrap_reservoir"
     data-symbol-version="1.1"
     data-symbol-form="stroke_geometry"
     data-symbol-status="draft"
     data-symbol-source-ref="USER_ANNOTATED:Bootstrap Type Reservoir.svg">

  <title>带液位计的自增压液压油箱（描边重绘草图）</title>
  <!--
    依据：按用户标注 SVG 的可见外轮廓、三处接口根部和上部自增压特征，
    以开放描边几何重绘；未复用其 fill 描摹路径。

    未确认项：
    - TANK-001.port_assignment_left_right_unverified：左右吸油/回油功能尚未由标准页核验；
    - TANK-001.separator_type：未绘制或声明任何隔离机构；
    - TANK-001.return_port_count：仅保留目录现有的一个 return_in，不推断实际回油口数量；
    - 内部竖直构件仅复现原件可见线条，非活塞、弹簧、液位计或其他内部机构的确认性表达。
  -->

  <!-- 所有可见本体线宽由整图 .sym-outline 统一施加为 1.5T。 -->
  <g id="symbol" class="sym-outline" fill="none" stroke="#000000"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- 油箱壳体与顶部受压腔外形。 -->
    <path id="tank-shell" d="M20 148 Q109 106 198 148 L198 458
                             Q155 478 109 482 Q63 478 20 458 Z"/>
    <path id="upper-chamber" d="M20 350 H198 M20 385 H198"/>

    <!-- 用户原件中可见的上部自增压示意；不对其内部工作机理作推断。 -->
    <circle id="bootstrap-indicator" cx="109" cy="70" r="28"/>
    <path id="bootstrap-indicator-band" d="M81 70 H137 M89 51 H129 M89 89 H129"/>
    <path id="bootstrap-link" d="M137 70 L164 42"/>
    <path id="bootstrap-direction" d="M158 22 L178 2 L169 25 L187 20 L166 48"/>

    <!-- 仅按原件可见线条保留的下部构型；未赋予其隔离/液位/弹簧语义。 -->
    <path id="lower-left-outline" d="M20 385 H84 V493 H20"/>
    <path id="lower-right-outline" d="M134 385 H198 V493 H134"/>
    <path id="central-visible-structure" d="M84 385 H104 V532 H134 V385
                                             M104 510 H134 M104 548 H134 V552 H104 Z"/>
    <path id="right-visible-structure" d="M134 493 H166 V538 L177 550 V564"/>
    <!-- 原件中已有的方向特征，作为符号内部几何保留，不是渲染器管线箭头。 -->
    <path id="motion-arrow-up" d="M50 492 V440 M42 453 L50 437 L58 453"/>
    <path id="motion-arrow-down" d="M194 440 V492 M186 479 L194 495 L202 479"/>

    <!-- 三个接口嘴：端口落在 viewBox 边界，管网从红色端口标记处起算。 -->
    <line id="lead-return-in" x1="0" y1="410" x2="20" y2="410"/>
    <line id="lead-suction-out" x1="198" y1="410" x2="218" y2="410"/>
    <line id="lead-bootstrap-pressure-in" x1="172" y1="514" x2="172" y2="564"/>
  </g>

  <g id="connection-points" fill="#ff0000">
    <circle id="port-bootstrap-pressure-in" cx="172" cy="564" r="3"
            data-port-id="bootstrap_pressure_in" data-medium="hydraulic"
            data-port-role="pressure" data-flow-capability="in"
            data-anchor-direction="down"/>
    <circle id="port-suction-out" cx="218" cy="410" r="3"
            data-port-id="suction_out" data-medium="hydraulic"
            data-port-role="suction" data-flow-capability="out"
            data-anchor-direction="right"/>
    <circle id="port-return-in" cx="0" cy="410" r="3"
            data-port-id="return_in" data-medium="hydraulic"
            data-port-role="return" data-flow-capability="in"
            data-anchor-direction="left"/>
  </g>
</svg>
