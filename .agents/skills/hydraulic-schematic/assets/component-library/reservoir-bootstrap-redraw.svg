<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 258 584"
     width="258" height="584"
     data-component-type="bootstrap_reservoir"
     data-symbol-version="1.1"
     data-symbol-form="stroke_geometry"
     data-symbol-status="draft"
     data-symbol-source-ref="USER_ANNOTATED:Bootstrap Type Reservoir.svg">

  <title>带液位计的自增压液压油箱（stroke_geometry 重画）</title>
  <!-- 依据：按用户标注 SVG reservoir-bootstrap-annotated.svg 的可见外轮廓、
       三处端口根部和上部自增压指示，以开放描边几何重绘；未复用其 fill 描摹路径。

       端口坐标：根据标注件内部接口根部位置(83,420)(212,420)(192,502)，
       加上端口线后引至 viewBox 边界(0,410)(238,410)(192,584)，
       viewBox 原点调整为(0,0)以对齐 6.3.1 模板。

       符号内方向箭头 (motion-arrow-up, motion-arrow-down) 按规范
       10.6.2 保留：属符号内部受控方向特征，不是渲染器管线箭头。

       本体线宽由整图 .sym-outline 统一施加 1.5T；禁止写死绝对线宽。

       未确认项：
       - TANK-001.port_assignment_left_right_unverified：
         左侧 return_in(0,410)、右侧 suction_out(238,410) 的功能分配
         依据标注件注释推断（左有向上实心箭头、右为弹簧状斜线），
         未由标准页核对。若左右接反，整个系统回油与吸油走向全部反转。
       - TANK-001.separator_type：隔离机构类型未确认，未绘制确认性几何。
       - TANK-001.return_port_count：仅保留目录现有的一个 return_in，
         不推断实际回油口数量（可能影响整图 V12/V13 布线冲突）。
       - 内部竖直线条仅复现标注件可见几何，非活塞、弹簧、液位计或
         其他内部机构的确认性表达。 -->

  <!-- 所有可见本体线宽由整图 .sym-outline 统一施加为 1.5T。 -->
  <g id="symbol" class="sym-outline" fill="none" stroke="#000000"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- 油箱壳体与顶部增压腔外形，简化为可控描边几何。 -->
    <path id="tank-shell" d="M30 158 Q129 116 228 158 L228 478
                             Q179 502 129 506 Q79 502 30 478 Z"/>
    <line id="upper-chamber-divider-1" x1="30" y1="360" x2="228" y2="360"/>
    <line id="upper-chamber-divider-2" x1="30" y1="395" x2="228" y2="395"/>

    <!-- 上部自增压示意圆环及方向指示，按标注件位置保留。 -->
    <circle id="bootstrap-indicator" cx="129" cy="80" r="32"/>
    <line id="bootstrap-indicator-band-1" x1="97" y1="80" x2="161" y2="80"/>
    <line id="bootstrap-indicator-band-2" x1="105" y1="59" x2="153" y2="59"/>
    <line id="bootstrap-indicator-band-3" x1="105" y1="101" x2="153" y2="101"/>
    <line id="bootstrap-link" x1="161" y1="80" x2="192" y2="50"/>
    <path id="bootstrap-direction" d="M186 28 L208 6 L198 32 L218 26 L194 58"/>

    <!-- 仅按标注件可见线条保留的下部构型，未赋予确认语义。 -->
    <rect id="lower-left-chamber" x="30" y="395" width="74" height="118"
          fill="none"/>
    <rect id="lower-right-chamber" x="154" y="395" width="74" height="118"
          fill="none"/>
    <polyline id="central-visible-structure" points="104,395 124,395 124,552 154,552 154,395"
              fill="none"/>
    <line id="central-crossbar-1" x1="124" y1="530" x2="154" y2="530"/>
    <polyline id="central-bottom-detail" points="124,568 124,572 154,572 154,568"
              fill="none"/>
    <polyline id="right-visible-structure" points="154,513 186,513 186,558 197,570 197,584"
              fill="none"/>

    <!-- 符号内部方向箭头，按规范 10.6.2 保留为受控几何，非渲染器管线箭头。 -->
    <polyline id="motion-arrow-up" points="60,512 60,450" fill="none"/>
    <path id="motion-arrow-up-head" d="M52 463 L60 447 L68 463"/>
    <polyline id="motion-arrow-down" points="224,450 224,512" fill="none"/>
    <path id="motion-arrow-down-head" d="M216 499 L224 515 L232 499"/>

    <!-- 三个接口嘴：端口落在 viewBox 边界，管网从红色端口标记处起算。 -->
    <line id="lead-return-in" x1="0" y1="410" x2="30" y2="410"/>
    <line id="lead-suction-out" x1="228" y1="410" x2="258" y2="410"/>
    <line id="lead-bootstrap-pressure-in" x1="192" y1="514" x2="192" y2="584"/>
  </g>

  <g id="connection-points" fill="#ff0000">
    <circle id="port-bootstrap-pressure-in" cx="192" cy="584" r="3"
            data-port-id="bootstrap_pressure_in" data-medium="hydraulic"
            data-port-role="pressure" data-flow-capability="in"
            data-anchor-direction="down"/>
    <circle id="port-suction-out" cx="258" cy="410" r="3"
            data-port-id="suction_out" data-medium="hydraulic"
            data-port-role="suction" data-flow-capability="out"
            data-anchor-direction="right"/>
    <circle id="port-return-in" cx="0" cy="410" r="3"
            data-port-id="return_in" data-medium="hydraulic"
            data-port-role="return" data-flow-capability="in"
            data-anchor-direction="left"/>
  </g>
</svg>
