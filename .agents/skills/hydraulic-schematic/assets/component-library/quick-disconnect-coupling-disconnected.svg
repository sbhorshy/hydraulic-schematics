<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 7.5117 160 67.6056"
     width="160" height="67.6056"
     data-component-type="quick_disconnect_coupling"
     data-symbol-version="1.3"
     data-symbol-form="stroke_geometry"
     data-symbol-status="provisional"
     data-symbol-source-ref="root/Quick Disconnect Coupling_disconnected.svg potrace traced original, 4.0 px per unit measured"
     data-symbol-state="disconnected">
<!-- 2026-09-29 画布重表达 k=1(符号规范化 campaign):按渲染缩放率 k=0.751174 均匀缩放全部几何,viewBox 0 10 213 90 → 0 7.5117 160 67.6056;占位 160×68 不变,图上几何不变,渲染缩放补偿归一。 -->

  <!-- 描边几何重绘,取代根目录 potrace 描摹填充版 Quick Disconnect Coupling_disconnected.svg。
       几何依据:对原描摹件按 4.0 px/单位实测(3x 渲染 + 像素行程分析)。

       v1.2 方框本体基准统一(2026-08-30):阀体方框 95x88 -> 80x80,
       落位 (67,15)-(147,95)(与仪表族同位);水平流线中线 y=62 -> 55。内部元件:
         "<" 阀瓣:顶点 rel(0.200,0.500) -> (83,55),两臂 45° 张向右,
           臂尖 rel(0.610,0.057/0.943) -> (116,20)/(116,90)
         阀球:圆心 rel(0.600,0.500) -> (115,55);相切几何重算:顶点距 83->115 = 34,
           45° 臂理论掠切半径 34*sin45° = 24.0,取 r=23(臂缘距 22.6,与原版
           26.9/27 同为描边宽内的视觉相切,保持"两臂掠过圆缘"画法)
         右流线:自阀球右缘 (138,55) 至右边界 (213,55)(断开位,右端无竖杆)
         左端:分离半端竖杆 x=1(右移1防边界裁切,同 v1.1),y 55±17(随本体等比);
           左流线自左边界 (0,55) 穿竖杆至阀瓣顶点 (83,55),实测原图线连续无断口

       v1.3 端口侧别语义定案(2026-09-07 工程确认):
         右侧座端(方框+自封阀瓣)=机侧,接机载油路;
         左侧分离半端(带端杆线端)=地面接口,断开位悬空。
         端口名由流向语义 inlet/outlet 改为侧别语义 ground_side/aircraft_side:
         本文件被压力/回油两类型共用,两者接通位流向相反(压力:地面车供压进入,
         回油:机上回油引出),流向名无法对两类型同时成立,侧别名才是共件不变量。
         SVG 内 data-port-role/flow-capability 仅为压力型默认值,回油型由
         catalog 覆写 role=return 并按接通位反转 flow_capability。
       语义:快速自封接头,断开位。左端竖杆=分离半端(地面接口,带端杆的线端),
           方框=座端(机侧,带 Internal 自封阀瓣);圆+两臂为封闭阀瓣图形。
           组件图元仅有左右两个油口。
       状态对约束:配对件(mated)仍是根目录 potrace 原始件,重绘转正时须以本件
           坐标系为基准对齐端口(同类水平中线、同向端口、同名
           ground_side/aircraft_side),保证两状态在图上互换时端口不漂移
           (方框基准豁免件,见 symbol-library.md「方框本体基准」)。
       未确认项: 无标准页依据(status=provisional);介质液压已随 2026-09-07
           确认定案(地面压力/回油服务接头,非气动充气线);连接位变体端口组
           补齐挂账 unknown: quick-disconnect-port-redraw-pending。

       线宽 stroke-width=2 (基准 T);端口坐标为精确几何端点。 -->

  <g id="symbol" fill="none" stroke="#000000" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- 阀体方框(座端,80x80 本体基准) -->
    <path id="housing" d="M50.3286 11.2676 H110.4225 V71.3615 H50.3286 Z"/>
    <!-- 左端:分离半端竖杆(线端,右移1防边界裁切) + 流线(自左边界至阀瓣顶点) -->
    <line id="mating-half-tick" x1="0.7512" y1="28.5446" x2="0.7512" y2="54.0845"/>
    <line id="line-left" x1="0" y1="41.3146" x2="62.3474" y2="41.3146"/>
    <!-- 封闭阀瓣:圆 + 45° 两臂包拢圆缘 -->
    <circle id="poppet-ball" cx="86.385" cy="41.3146" r="17.277"/>
    <path id="poppet-jaws" d="M87.1362 15.0235 L62.3474 41.3146 L87.1362 67.6056"/>
    <!-- 右流线:自阀球右缘至 viewBox 右边界(断开位,右端无竖杆) -->
    <line id="line-right" x1="103.662" y1="41.3146" x2="160" y2="41.3146"/>
  </g>

  <g id="connection-points" fill="#ff0000">
    <!-- 左:地面接口(分离半端),断开位悬空是预期语义 -->
    <circle id="port-ground-side" cx="0" cy="41.3146" r="1.5023"
            data-port-id="ground_side"
            data-medium="hydraulic"
            data-port-role="pressure"
            data-flow-capability="in"
            data-anchor-direction="left"/>
    <!-- 右:机载油路(座端,自封常通侧) -->
    <circle id="port-aircraft-side" cx="160" cy="41.3146" r="1.5023"
            data-port-id="aircraft_side"
            data-medium="hydraulic"
            data-port-role="pressure"
            data-flow-capability="out"
            data-anchor-direction="right"/>
  </g>
</svg>
