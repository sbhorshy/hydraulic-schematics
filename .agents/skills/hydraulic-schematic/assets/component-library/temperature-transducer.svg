<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 7 148 89"
     width="148" height="89"
     data-component-type="temperature_transducer"
     data-symbol-version="1.2"
     data-symbol-form="stroke_geometry"
     data-symbol-status="provisional"
     data-symbol-source-ref="root/Temperature Transducer.svg potrace traced original, 4.0 px per unit measured"
     data-envelope-class="single">

  <!-- v1.2 方框本体基准统一(2026-08-30):与 pressure-transducer v1.2 同版重排,
       变送本体 57x54 -> 80x80,落位 (67,15)-(147,95);变送元件逐元同压力版:
         弧线 M81 36 Q107 16.5 133 35;臂 (90,43)-(107,85);
         实心圆 (107,85) r=4;箭头 polygon (87,32) (85,49) (98,43)。
       感温包:沿用用户确认约定(左框为正方形、右缘与变送框左缘共边、
         竖向中线与感温线同高)——36x36 保留为附件方框(边<60,非本体),
         随本体中线 y=40 -> 55 移到 (31,37)-(67,73)。
       感温短线接口处不连续(同温度开关约定):外段 (0,55)-(31,55);
         内段 (36,55)-(53,55);感温圆 (56,55) r=3。
       电信号口:无——v1.2 曾按家族惯例推断顶边引线 (107,15)-(107,7) 与
         elec_out (107,7) up,2026-09-01 用户裁决:实际元件没有该口,一并撤销。
       端口(与 catalog temperature_transducer 条目双向一致):
         temp_sense (0,55) anchor=left。
       未确认项(引用本符号的 L0 文件须在 unknown 登记):
         - 无标准页依据(status=provisional);
         - 无电信号口(2026-09-01 用户裁决)。
       线宽 stroke-width=2 (基准 T);端口坐标为精确几何端点。 -->

  <g id="symbol" fill="none" stroke="#000000" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- 感温包正方形(36x36 附件,右缘与变送框左缘共边) -->
    <path id="bulb-housing" d="M31 37 H67 V73 H31 Z"/>
    <!-- 变送大方框 (80x80 本体基准) -->
    <path id="transducer-housing" d="M67 15 H147 V95 H67 Z"/>
    <!-- 感温短线:外段自 viewBox 左边界止于感温包左缘;框内为悬浮独立线段 -->
    <line id="temp-sense-line" x1="0" y1="55" x2="31" y2="55"/>
    <line id="bulb-line-inner" x1="36" y1="55" x2="53" y2="55"/>
    <!-- 实心感温圆 (56,55) r=3,双弧路径 -->
    <path id="bulb-dot" d="M53 55 A3 3 0 1 0 59 55 A3 3 0 1 0 53 55 Z"
          fill="#000000" stroke="none"/>

    <!-- 变送元件:上凸弧线 + 斜臂 + 下端实心圆(双弧路径) -->
    <path id="transducer-arc" d="M81 36 Q107 16.5 133 35"/>
    <line id="transducer-arm" x1="90" y1="43" x2="107" y2="85"/>
    <path id="transducer-dot" d="M103 85 A4 4 0 1 0 111 85 A4 4 0 1 0 103 85 Z"
          fill="#000000" stroke="none"/>
    <polygon id="transducer-arrow" points="87,32 85,49 98,43"
         fill="#000000" stroke="none"/>
  </g>

  <g id="connection-points" fill="#ff0000">
    <circle id="port-temp-sense" cx="0" cy="55" r="2"
            data-port-id="temp_sense"
            data-medium="hydraulic"
            data-port-role="measurement"
            data-flow-capability="none"
            data-anchor-direction="left"/>

  </g>
</svg>
