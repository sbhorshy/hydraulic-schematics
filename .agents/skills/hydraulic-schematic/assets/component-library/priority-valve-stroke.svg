<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140"
     width="240" height="140"
     data-component-type="priority_valve"
     data-symbol-version="1.6"
     data-symbol-form="stroke_geometry"
     data-internal-geometry="APPROXIMATE_PENDING_STANDARD">

  <!-- 由 Priority Valve.svg(potrace 描摹填充版)转换。
       外形与圆为实测值,内部机构为近似复现,见文末待确认。

       实测(原 324x180)-> 本版(240x140),比例 0.7407:
         阀体框 外缘 74..240 x 24..147.5,填充厚 4.5
                中心线 76.3..237.8 x 26.3..145.3  -> 56..176 x 19..107
         主管中心线 Y=62.8(上下缘 59.5/66.4)      -> Y=46
         上圆 最小二乘 c=(174.5,62.8) r=18.0 dev=0.3 -> c=(129,46) r=13
         下圆 最小二乘 c=(154.6,115.8) r=14.5 dev=0.3 -> c=(115,86) r=11
         内环 sp7 X 92.3..222.0 Y 64.0..114.6     -> X 68..164 Y 47..85
         外环 sp6 X 78.0..149.5 Y 64.2..143.2     -> X 58..111 Y 48..106
         流向箭头 X 262.2..304.0 Y 42.9..50.6     -> X 196..222 Y=33

       v1.1 修正 v1.0 五处渲染缺陷:
         1. 缺三通实心节点。技术规范 §10.5 要求三通显示实心节点,
            先导支路自主管分出处必须画点。已按内外环起点 X=60/164 补。
         2. 先导环底 Y=106 与阀体底边 Y=109 仅差 3,渲染成双线。
            按实测改为内环底 Y=85、外环底 Y=100,与底边留 7 单位。
         3. 弹簧过短(78..111)且幅值过小,渲染后几乎不可辨。
            按实测上部组件跨度改为 78..116,幅值 ±8。
         4. 下圆游离于先导环外。实测下圆心 Y=86 与内环底 Y=85 重合,
            即圆坐落在内环上,已改为环穿圆。
         5. 流向箭头为细线开口箭头,原符号为实心三角。已改实心。

       原文件已移除项:
         style="width:851.85px" 覆盖 viewBox 尺寸,删除;
         右下方遮罩删除(见待确认第 1 条);
         端口红点 opacity=0.8 改 visibility="hidden"(原会印在正式图上)。

       端口归一化到 viewBox 左右边界(x=0/240)。原符号左管起于 8.5、
       右管止于 304.8 而 viewBox 宽 324,两端留白不等,同排元件接线不齐。

       线宽 stroke-width=2 (基准 T)。 -->

  <g id="symbol" fill="none" stroke="#000000" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- 阀体外框 -->
    <rect x="56" y="19" width="120" height="88"/>

    <!-- 主管路:中心线 Y=46,贯穿阀体 -->
    <line x1="0" y1="46" x2="56" y2="46"/>
    <line x1="176" y1="46" x2="240" y2="46"/>
    <line x1="56" y1="46" x2="78" y2="46"/>
    <line x1="142" y1="46" x2="176" y2="46"/>

    <!-- ===== 内部机构:近似复现 ===== -->

    <!-- 弹簧:原符号约 4 个完整波峰 -->
    <path d="M78 46 L81 38 L87 54 L93 38 L99 54 L105 38 L111 54 L114 46"/>

    <!-- 上部可调元件:圆 + 贯穿斜箭头。
         斜线两端均伸出圆外,末端实心箭头 = 该元件可调(标准记法)。
         v1.3 曾画成圆内封闭斜线 + 游离箭头,语义错误。 -->
    <circle cx="129" cy="46" r="13"/>
    <line x1="115" y1="60" x2="147" y2="29"/>

    <!-- 内先导环:两三通之间的闭合支路,下部可调元件串接在其上。
         实测 sp7 X 92.3..222.0 Y 64.0..114.6 -> 本版 X 68..164 Y 47..85。 -->
    <path d="M164 46 L164 77 Q164 85 156 85 L126 85"/>
    <path d="M104 85 L76 85 Q68 85 68 77 L68 46"/>

    <!-- 外先导环:两三通之间的第二条闭合支路,位于内环下方。
         实测 sp6 X 78.0..149.5 Y 64.2..143.2 -> 本版 X 58..111 Y 47..100。
         v1.5 曾据 sp6 右界 111 将环截断,渲染出悬空断头——该数值是
         描摹轮廓的一段,不是环的端点。已恢复闭合。 -->
    <path d="M60 46 L60 92 Q60 100 68 100 L164 100 Q172 100 172 92 L172 46"/>

    <!-- 下部可调元件:圆 + 贯穿斜箭头,同上 -->
    <circle cx="115" cy="86" r="11"/>
    <line x1="103" y1="98" x2="130" y2="72"/>
  </g>

  <!-- 调节箭头:实心三角,自阀体内向上穿出顶边。
       原符号该箭头为实心且箭尖在阀体框上方,v1.2 误作细线开口箭头
       且止于框内。 -->
  <!-- 调节箭头:实心,箭尖止于阀体框内(实测原 sp1 上缘 Y=27.0,
       框内缘 Y=26.3,即箭尖贴框但不穿出 -> 本版 Y=21,框顶 Y=19)。
       v1.4 曾让箭杆穿出框顶,是错的。 -->
  <g id="adjust-arrow" fill="#000000" stroke="none">
    <rect x="67" y="29" width="2" height="17"/>
    <path d="M63 30 L68 21 L73 30 Z"/>
  </g>

  <!-- 三通实心节点:先导支路自主管分出处 -->
  <g id="junctions" fill="#000000" stroke="none">
    <circle cx="60" cy="46" r="3"/>
    <circle cx="164" cy="46" r="3"/>
  </g>

  <!-- 可调箭头:置于两条贯穿斜线的末端(斜线伸出圆外),
       与斜线共同构成"可调"记法。原符号中上圆右下、下圆左上
       各有一个实心三角箭头,指向该圆,是可调节流的标准表示。
       实测(原坐标):上圆旁 X 197.0..201.5 Y 60.7..69.5 -> 本版 (146,49)
                     下圆旁 X 133.6..136.0 Y 113.9..119.4 -> 本版 (100,86)
       箭头指向与斜线含义须依标准页确认,见待确认第 4 条。 -->
  <g id="throttle-arrows" fill="#000000" stroke="none">
    <path d="M147 29 L139 33 L143 41 Z"/>
    <path d="M103 98 L111 94 L107 86 Z"/>
  </g>

  <!-- 流向箭头:实心三角,指向阀体 -->
  <g id="flow-arrow" fill="#000000" stroke="none">
    <rect x="204" y="32" width="18" height="2"/>
    <path d="M204 28 L196 33 L204 38 Z"/>
  </g>

  <g id="connection-points" visibility="hidden">
    <circle id="port-high-pressure-in" cx="240" cy="46" r="2"
            data-port-id="high_pressure_in"
            data-medium="hydraulic"
            data-port-role="pressure"
            data-flow-capability="in"
            data-anchor-direction="right"/>
    <circle id="port-low-pressure-out" cx="0" cy="46" r="2"
            data-port-id="low_pressure_out"
            data-medium="hydraulic"
            data-port-role="pressure"
            data-flow-capability="out"
            data-anchor-direction="left"/>
  </g>

  <!-- *** 待确认(阻断正式入库) ***

       1. 原文件用遮罩隐藏了一条对外连接,疑为第三个端口。
          被遮图形实测位于 X 253.6..283.5 Y 127.1..131.0(原坐标),
          在阀体右边界 X=240 之外,即一条伸出阀体的外部管路加箭头,
          不是装饰。优先阀按功能通常有三口:压力进、优先出、次级出;
          本符号目前只有两口。该遮罩可能遮掉了次级出口。
          须确认:是绘制取舍,还是误遮。本版按当前外观处理,端口数 2。

       2. 原文件端口 ID 从 Bootstrap Type Reservoir.svg 复制而来,
          两文件 id 完全相同(蓄压油箱的 ID 用在优先阀上无意义),
          且其 data-direction="down" 也是照抄——该口在左边界,应为 left。
          本版按技术规范 §7 的 priority_valve 定义改为
          high_pressure_in / low_pressure_out,须确认与实际相符。

       3. 进流方向与布局惯例相反。箭头指向左,故压力进口在右、出口在左,
          与 layout-rules 的 prefer_main_flow: left_to_right 相反。
          若实际为左进右出,须镜像重绘本源文件并交换端口。

       4. 内部机构(调节箭头、弹簧、两圆及其斜线、两条先导环)为近似复现。
          原符号为填充路径,内部笔画无法由轮廓可靠分解——同一方法在
          filter 符号上已连续误判四次。两个圆各带一条贯穿斜线的含义、
          两条先导环的确切走向与连接点,均须依符号标准页确认,
          不得以本版为准。
  -->
</svg>
