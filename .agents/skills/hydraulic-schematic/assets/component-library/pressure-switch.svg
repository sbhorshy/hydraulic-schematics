<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 7 190 89"
     width="190" height="89"
     data-component-type="pressure_switch"
     data-symbol-version="1.1"
     data-symbol-form="stroke_geometry"
     data-symbol-status="provisional"
     data-symbol-source-ref="root/Pressure Switch.svg potrace traced original, 4.0 px per unit measured"
     data-envelope-class="single">

  <!-- 描边几何重绘,取代根目录 potrace 描摹填充版 Pressure Switch.svg。
       几何依据:对原描摹件按 4.0 px/单位实测(3x 渲染 + 像素行程分析)。

       v1.1 方框本体基准统一(2026-08-30):本体方框 70x70 -> 80x80,
       落位 (67,15)-(147,95)(与 transducer 族同位);内部元件按原比例重排到整数网格:
         取压管线中线 y=57 -> 55(本体竖向中线),自左边界直连框左缘 (0,55)-(67,55)
         整定弹簧(右侧):attach (130,74) -> (147,74),振幅 y 40/74 -> 36/74,
           折点 x 141/149/158/166.5 -> 160/169/179/189,止于右下谷点(同原图,无回程段)
         电开关触点(框内,全实心圆,双弧路径实现——C8 对"顶点<=4 且闭合"短路径放行):
           铰点圆   (74,42.5) r=6   -> (83,38) r=7
           动臂     自铰点上方 (75,32.5) 斜向右下 -> (84,27)-(107,77)
           动触点圆 (95,76.5) r=6   -> (107,77) r=7
           固定触点圆 (118.5,42.5) r=6 -> (134,38) r=7
           触点断开位:动臂末端点在下,固定触点在右上,二者分离(同原图)

       端口与 catalog pressure_switch 条目对齐(/connection-points):
         port-pressure-sense:取压口,role=measurement,anchor=left,落左边界 (0,55)
           (v1.0 曾悬在 (6,57) 内部,C10 违例,此版修复)。catalog 记 anchor_direction=down
           与图面不符,以图面实测为准(left),catalog 随本次基准统一票修订。
         port-elec-out:电信号口,medium=electrical,role=signal_out,anchor=up。
           v1.0 缺失(C4 违例),此版补齐:开关触点画在框内即表意,按家族惯例
           自框顶边中部 (107,15) 向上引线至顶边界 (107,7),渲染器自端头连线
           (画法同 temperature-transducer v1.1 约定)。

       未确认项(引用本符号的 L0 文件须在 unknown 登记):
         - 无标准页依据(status=provisional);
         - elec_out 引出方向(up)为家族惯例推断,非原件实测。

       线宽 stroke-width=2 (基准 T);端口坐标为精确几何端点。 -->

  <g id="symbol" fill="none" stroke="#000000" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- 壳体方框 (80x80 本体基准) -->
    <path id="housing" d="M67 15 H147 V95 H67 Z"/>
    <!-- 取压管线:左端为取压口,右端接壳体 -->
    <line id="sense-line" x1="0" y1="55" x2="67" y2="55"/>

    <!-- 整定弹簧(右侧,整定压力) -->
    <polyline id="set-spring" points="147,74 160,36 169,74 179,36 189,74"/>
    <!-- 电开关触点:铰点、动臂、动触点、固定触点(断开位) -->
    <path id="pivot-dot" d="M76 38 A7 7 0 1 0 90 38 A7 7 0 1 0 76 38 Z"
          fill="#000000" stroke="none"/>
    <path id="movable-dot" d="M100 77 A7 7 0 1 0 114 77 A7 7 0 1 0 100 77 Z"
          fill="#000000" stroke="none"/>
    <path id="fixed-dot" d="M127 38 A7 7 0 1 0 141 38 A7 7 0 1 0 127 38 Z"
          fill="#000000" stroke="none"/>
    <line id="contact-arm" x1="84" y1="27" x2="107" y2="77"/>

    <!-- 电信号口引线:顶边中部 (107,15) 向上至顶边界 (107,7)
         (#21 修通:注释 v1.1 已声明本引线,图面漏画,随 elec_out 端口点一并补齐) -->
    <line id="elec-out-line" x1="107" y1="15" x2="107" y2="7"/>
  </g>

  <g id="connection-points" fill="#ff0000">
    <circle id="port-pressure-sense" cx="0" cy="55" r="2"
            data-port-id="pressure_sense"
            data-medium="hydraulic"
            data-port-role="measurement"
            data-flow-capability="none"
            data-anchor-direction="left"/>
    <circle id="port-elec-out" cx="107" cy="7" r="2"
            data-port-id="elec_out"
            data-medium="electrical"
            data-port-role="signal_out"
            data-flow-capability="none"
            data-anchor-direction="up"/>
  </g>
</svg>
