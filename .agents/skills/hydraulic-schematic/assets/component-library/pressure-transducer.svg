<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 7 148 89"
     width="148" height="89"
     data-component-type="pressure_transducer"
     data-symbol-version="1.2"
     data-symbol-form="stroke_geometry"
     data-symbol-status="provisional"
     data-symbol-source-ref="root/Pressure Transducer.svg potrace traced original, 4.0 px per unit measured"
     data-envelope-class="single">

  <!-- v1.2 方框本体基准统一(2026-08-30):本体方框 57x54 -> 80x80,
       落位 (67,15)-(147,95);变送元件按原比例重排到整数网格:
         上凸弧线 M81 36 Q107 16.5 133 35 (顶点过 (107,26),原顶点/框高 0.135 -> 11)
         臂 (90,43)-(107,85);下端实心圆 (107,85) r=4 (原 r=3.5)
         臂上部实心箭头 polygon (87,32) (85,49) (98,43)
       取压线随本体中线 y=40 -> 55,自左边界直连框左缘 (0,55)-(67,55)
       (压力口为直接连接,不适用感温包的"接口断开"约定)。
       端口:port-pressure-sense (0,55) 落左边界(v1.1 曾悬在 (6,40) 内部,C10 违例,此版修复)。
       附件方框:无。catalog 暂无 pressure_transducer 条目,待目录增补;
       elec_out 电口本版仍缺,与温度变送器族对齐时一并补(引用本符号的 L0 文件须登记)。
       线宽 stroke-width=2 (基准 T);端口坐标为精确几何端点。 -->

  <g id="symbol" fill="none" stroke="#000000" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- 变送大方框 (80x80 本体基准) -->
    <path id="transducer-housing" d="M67 15 H147 V95 H67 Z"/>
    <!-- 压力取压线:自取压口直连框左缘 -->
    <line id="pressure-sense-line" x1="0" y1="55" x2="67" y2="55"/>
    <!-- 变送元件:上凸弧线 + 臂(单线段) + 下端实心圆 + 臂上部实心箭头 -->
    <path id="transducer-arc" d="M81 36 Q107 16.5 133 35"/>
    <line id="transducer-arm" x1="90" y1="43" x2="107" y2="85"/>
    <path id="transducer-dot" d="M103 85 A4 4 0 1 0 111 85 A4 4 0 1 0 103 85 Z"
          fill="#000000" stroke="none"/>
    <polygon id="transducer-arrow" points="87,32 85,49 98,43"
             fill="#000000" stroke="none"/>
  </g>

  <g id="connection-points" fill="#ff0000">
    <circle id="port-pressure-sense" cx="0" cy="55" r="2"
            data-port-id="pressure_sense"
            data-medium="hydraulic"
            data-port-role="measurement"
            data-flow-capability="none"
            data-anchor-direction="left"/>
  </g>
</svg>
