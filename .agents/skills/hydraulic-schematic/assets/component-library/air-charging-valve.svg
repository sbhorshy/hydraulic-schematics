<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:sym="urn:hydraulic-symbol"
     version="1.2"
     width="134" height="57" viewBox="0 0 134 57"
     preserveAspectRatio="xMidYMid meet"
     data-status="draft"
     data-component-type="air_charging_valve"
     data-symbol-version="1.2"
     data-symbol-status="draft"
     data-symbol-form="stroke_geometry"
     data-symbol-source-ref="REDRAWN_FROM:Air-Charging Valve for Accumulator.svg"
     data-mirror-allowed="false"
     data-allowed-rotations="0 90 180 270">
<!-- 2026-09-29 画布重表达 k=1(符号规范化 campaign):按渲染缩放率 k=0.5 均匀缩放全部几何,viewBox 0 0 268 114 → 0 0 134 57;占位 134×57 不变,图上几何不变,渲染缩放补偿归一。 -->

  <title>Editable stroke symbol — draft</title>
  <desc>Reconstructed from the user-supplied filled-outline SVG as editable stroke geometry. Visible component semantics are not confirmed by a standard page and remain draft/unknown. Port anchors are machine-readable. Mirroring is forbidden.

    v1.2 端口侧别对调(2026-09-07 用户口径:左侧=地面充气侧,右侧=气侧/蓄压器侧;与此前的形位判读相反)。
    端口号与几何位置互换重标,可见几何不动;左引线一并延至 viewBox 边界
    (M0 59 H75,同步项目工作目录 v0.3 既有修正,规范源此前漏同步)。
    内部图元(左端竖杆/中央对顶三角/右侧小三角)语义仍 unknown,未随端口重标断言。</desc>

  <style>
    .sym-outline {
      fill: none;
      stroke: currentColor;
      stroke-width: calc(1.5 * var(--T));
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .port-anchor {
      fill: none;
      stroke: none;
      pointer-events: none;
    }
  </style>

  <metadata>
    <sym:symbol
      status="draft"
      geometry="stroke_geometry"
      source="user_supplied_filled_outline_svg"
      standardPageConfirmed="false"
      mirrorAllowed="false"
      allowedRotations="0,90,180,270"
      baseWidth="268"
      baseHeight="114"
      baseViewBox="0 0 268 114">

      <sym:ports>
        <sym:port id="charge_port"
                  x="0" y="29.5"
                  direction="left"
                  role="gas"
                  medium="pneumatic"
                  interfaceGeometry="symbol"
                  status="draft" />
        <sym:port id="accumulator_gas"
                  x="134" y="29.5"
                  direction="right"
                  role="gas"
                  medium="pneumatic"
                  interfaceGeometry="symbol"
                  status="draft" />
      </sym:ports>

      <sym:connections>
        <sym:pipeline id="main-horizontal-interface"
                      orientation="horizontal"
                      centerlineY="59"
                      fromPort="charge_port"
                      toPort="accumulator_gas"
                      status="geometry_reconstructed" />
      </sym:connections>

      <sym:components>
        <sym:component id="meta-left-end-feature" type="unknown" status="draft" standardPageConfirmed="false" />
        <sym:component id="meta-central-left-triangle" type="unknown" status="draft" standardPageConfirmed="false" />
        <sym:component id="meta-central-right-triangle" type="unknown" status="draft" standardPageConfirmed="false" />
        <sym:component id="meta-right-small-triangle" type="unknown" status="draft" standardPageConfirmed="false" />
      </sym:components>

      <sym:rotations>
        <sym:rotation angle="0" width="134" height="57" viewBox="0 0 134 57">
          <sym:anchor port="charge_port"     x="0"   y="29.5" direction="left" />
          <sym:anchor port="accumulator_gas" x="134" y="29.5" direction="right" />
        </sym:rotation>
        <sym:rotation angle="90" width="57" height="134" viewBox="0 0 57 134">
          <sym:anchor port="charge_port"     x="27.5" y="0"   direction="up" />
          <sym:anchor port="accumulator_gas" x="27.5" y="134" direction="down" />
        </sym:rotation>
        <sym:rotation angle="180" width="134" height="57" viewBox="0 0 134 57">
          <sym:anchor port="charge_port"     x="134" y="27.5" direction="right" />
          <sym:anchor port="accumulator_gas" x="0"   y="27.5" direction="left" />
        </sym:rotation>
        <sym:rotation angle="270" width="57" height="134" viewBox="0 0 57 134">
          <sym:anchor port="charge_port"     x="29.5" y="134" direction="down" />
          <sym:anchor port="accumulator_gas" x="29.5" y="0"   direction="up" />
        </sym:rotation>
      </sym:rotations>

      <sym:uncertainties>
        <sym:item id="component-identity" status="unknown" note="No standard page supplied; geometry reproduced without asserting component identity." />
        <sym:item id="port-media-role" status="unknown" note="Port SIDE assignment confirmed by user 2026-09-07: left = ground charging side (charge_port), right = accumulator gas side (accumulator_gas). Standard page still absent; internal geometry features remain unknown." />
      </sym:uncertainties>
    </sym:symbol>
  </metadata>

  <g id="visible-symbol" fill="none" stroke="#000000" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Left interface and vertical end feature -->
    <path id="left-end-feature"
          data-component-type="unknown"
          data-status="draft"
          d="M12.5 19.5 V39.5" />
    <path id="left-interface-line"
          data-network-id="main-horizontal-interface"
          data-interface-port="charge_port"
          d="M0 29.5 H37.5" />

    <!-- Central opposed triangular geometry; stroke-only, no filled outline tracing -->
    <path id="central-left-triangle"
          data-component-type="unknown"
          data-status="draft"
          d="M37.5 14.5 V43.5 L59.5 29.5 Z" />
    <path id="central-right-triangle"
          data-component-type="unknown"
          data-status="draft"
          d="M80.5 15 V43 L59.5 29.5 Z" />

    <!-- Horizontal interface between central and right-side feature -->
    <path id="middle-interface-line"
          data-network-id="main-horizontal-interface"
          d="M80.5 29.5 H97" />

    <!-- Right-side smaller triangular geometry -->
    <path id="right-small-triangle"
          data-component-type="unknown"
          data-status="draft"
          d="M97 22 V37.5 L110 29.5 Z" />

    <!-- Right interface to machine-readable anchor -->
    <path id="right-interface-line"
          data-network-id="main-horizontal-interface"
          data-interface-port="accumulator_gas"
          d="M110 29.5 H134" />
  </g>

  <!-- Invisible machine-readable connection anchors. -->
  <g id="connection-points" fill="#ff0000">
    <circle id="port-charge-anchor"
            class="port-anchor"
            cx="0" cy="29.5" r="1"
            data-port-id="charge_port"
            data-medium="pneumatic"
            data-port-role="gas"
            data-flow-capability="bidirectional"
            data-anchor-direction="left" />
    <circle id="port-accumulator-gas-anchor"
            class="port-anchor"
            cx="134" cy="29.5" r="1"
            data-port-id="accumulator_gas"
            data-medium="pneumatic"
            data-port-role="gas"
            data-flow-capability="bidirectional"
            data-anchor-direction="right" />
  </g>
</svg>
