# L0 负样例：把渲染分组当作拓扑节点
# 预期结果：ERROR，不产出 L2、审查卡或 SVG
# 用途：验证 L0 规范 9.1 与校核 15.3 第 14 条
#
# 这正是封装装配方案的思维惯性：把虚线框当成可连接的对象。
# 平坦拓扑下，管线穿越分组边界只表示成员对外接口，边界本身不是节点。

l0_version: "1.1"
system: NEGATIVE-GROUP-IN-PATH
catalog: comac-hydraulic-components@A
maturity: concept

extern:
  IN-001: inlet
  OUT-001: outlet

parts:
  CV-001: check_valve
  F-001: filter

# 违规行：把分组 ID 当作 path 项，等同于声明"油路连到虚线框上"。
paths:
  - [IN-001, "LRU-001.inlet_1"]
  - [CV-001, F-001, OUT-001]

groups:
  - id: LRU-001
    label: 滤油组件
    members: [CV-001, F-001]
    reason: not_field_removable

unknown:
  - pressure_class
